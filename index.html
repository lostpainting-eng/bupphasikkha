    ${isSecondary(s) ? `<label>ชื่อโรงเรียน (หน้าปก)</label><input id="rpt_school" value="${escapeHtml(r.school || '')}" placeholder="เช่น โรงเรียนเทศบาลบ้านสามกอง" onchange="rptSaveInfo()">` : `<label>รุ่นที่</label><input id="rpt_cohort" value="${escapeHtml(r.cohort)}" placeholder="เช่น 1/69" onchange="rptSaveInfo()">
    <label>จำนวนชั่วโมง</label><input id="rpt_hours" type="number" inputmode="numeric" value="${escapeHtml(r.hours)}" placeholder="เช่น 75" onchange="rptSaveInfo()">`}
    <label>แผนก/สาขางาน</label><input id="rpt_dept" value="${escapeHtml(r.dept)}" onchange="rptSaveInfo()">
    <label>ภาคเรียนที่</label><input id="rpt_term" value="${escapeHtml(r.term)}" onchange="rptSaveInfo()">
    <label>ปีการศึกษา (พ.ศ.)</label><input id="rpt_year" value="${escapeHtml(r.year)}" onchange="rptSaveInfo()">
    <label>เริ่มเรียน</label>${dateField('rpt_start', r.start, 'rptSaveInfo')}
    <label>ถึง (วันสิ้นสุด)</label>${dateField('rpt_end', r.end, 'rptSaveInfo')}
    <label>น้ำหนักของข้อปฏิบัติแบบ "ผสม": ทักษะ กี่ % — สร้างสรรค์ = 100 − ค่านี้</label>
    <input id="rpt_skillw" type="number" min="0" max="100" inputmode="numeric" value="${rptSkillW(r)}" onchange="rptSaveInfo()">
    <div class="meta">ตอนนี้ ทักษะ ${rptSkillW(r)}% : สร้างสรรค์ ${100 - rptSkillW(r)}%</div>
    <label>การปัดเศษคะแนนที่คำนวณจากชิ้นงาน/ข้อสอบ</label>
    <select id="rpt_round" onchange="rptSaveInfo()">
      <option value="half" ${r.round === 'half' ? 'selected' : ''}>ปัดเป็น 0.5 (เช่น 3.5, 4)</option>
      <option value="int" ${r.round === 'int' ? 'selected' : ''}>ปัดเป็นจำนวนเต็ม</option>
      <option value="tenth" ${r.round === 'tenth' ? 'selected' : ''}>ทศนิยม 1 ตำแหน่ง</option>
    </select>
    ${isSecondary(s) ? '' : `<label>รอบที่เปิดสอน</label>
    <div>${ck('morning', 'รอบเช้า')}${ck('afternoon', 'รอบบ่าย')}${ck('evening', 'รอบค่ำ')}</div>
    <div class="meta" style="margin-top:4px;">รอบที่ไม่เปิดสอนจะถูกขีดฆ่าวงกลมบนหน้าปก ตามรูปแบบของฟอร์มเดิม</div>`}
    <details style="margin-top:12px;"><summary style="cursor:pointer;font-weight:600;">ผู้ลงนามในฟอร์ม</summary>
      <label>หัวหน้าแผนก</label><input id="rpt_sg_dept" value="${escapeHtml(sg.deptHead)}" onchange="rptSaveInfo()">
      <label>หัวหน้างานวัดผลฯ</label><input id="rpt_sg_measure" value="${escapeHtml(sg.measure)}" onchange="rptSaveInfo()">
      <label>รองผู้อำนวยการฝ่ายวิชาการ</label><input id="rpt_sg_academic" value="${escapeHtml(sg.academic)}" onchange="rptSaveInfo()">
      <label>ผู้อำนวยการวิทยาลัย</label><input id="rpt_sg_director" value="${escapeHtml(sg.director)}" onchange="rptSaveInfo()">
    </details>
    <div id="rpt_info_msg" class="meta" style="margin-top:6px;"></div>`;
}
function rptSaveInfo() {
  const s = curSubject(), r = ensureReport(s), v = id => (byId(id) ? byId(id).value : '');
  if (byId('rpt_cohort')) r.cohort = v('rpt_cohort').trim(); if (byId('rpt_hours')) r.hours = v('rpt_hours').trim(); if (byId('rpt_school')) r.school = v('rpt_school').trim(); r.dept = v('rpt_dept').trim();
  r.round = v('rpt_round') || 'half'; r.skillW = Math.max(0, Math.min(100, Number(v('rpt_skillw')) || 0)); r.term = v('rpt_term').trim(); r.year = v('rpt_year').trim(); r.start = v('rpt_start'); r.end = v('rpt_end');
  ['morning', 'afternoon', 'evening'].forEach(k => { if (byId('rpt_r_' + k)) r.rounds[k] = !!byId('rpt_r_' + k).checked; });
  r.signers.deptHead = v('rpt_sg_dept').trim(); r.signers.measure = v('rpt_sg_measure').trim();
  r.signers.academic = v('rpt_sg_academic').trim(); r.signers.director = v('rpt_sg_director').trim();
  byId('rpt_info_msg').textContent = 'บันทึกข้อมูลแล้ว';
  rptRefreshExport();
}

// ---------- สมรรถนะ / หน่วยการเรียน ----------
function rptCompTotals(r) { return r.comps.map(c => c.items.reduce((a, it) => a + (Number(it.max) || 0), 0)); }
// กล่องรวมคะแนนสมรรถนะ (เต็ม 70) — เกิน 70 จะไปทับจิตพิสัย 30 จึงแจ้งเตือนสีแดง
function rptTotalBoxHtml(r) {
  const totals = rptCompTotals(r), grand = totals.reduce((a, b) => a + b, 0);
  const over = grand > 70, ok = grand === 70;
  const col = over ? '#B3261E' : ok ? '#3B6D11' : '#8a6d00', bg = over ? '#FCE8E6' : ok ? '#EAF3DE' : '#FFF6DC';
  const pct = Math.min(100, grand / 70 * 100);
  const msg = over
    ? `⚠️ <strong>เกินคะแนนสมรรถนะ ${grand - 70} คะแนน</strong> — ฟอร์มกำหนดสมรรถนะรวม 70 คะแนน ถ้าเกินจะไปทับช่องจิตพิสัย (30) ทำให้คะแนนรวมเกิน 100 ต้องลดคะแนนเต็มของข้อให้รวมไม่เกิน 70 ก่อนนำออก`
    : ok ? '✓ รวม 70 คะแนนพอดี ไม่ทับคะแนนจิตพิสัย (30)'
    : `ยังขาดอีก ${70 - grand} คะแนนจึงจะครบ 70 (ไม่เกินถือว่าใช้ได้ แต่คะแนนเต็มรวมจะไม่ถึง 100)`;
  return `<div style="position:sticky;top:0;z-index:20;background:${bg};border:2px solid ${col};border-radius:12px;padding:10px 12px;margin:8px 0;box-shadow:0 2px 8px rgba(0,0,0,.12);">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;">
      <span class="hd" style="font-size:calc(17px * var(--fs));color:${col};">รวมคะแนนสมรรถนะ</span>
      <span class="hd" style="font-size:calc(26px * var(--fs));color:${col};">${grand} <span style="font-size:.6em;">/ 70</span></span>
    </div>
    <div style="height:10px;border-radius:6px;background:#fff;border:1px solid ${col}55;margin:6px 0;overflow:hidden;"><div style="width:${pct}%;height:100%;background:${col};"></div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;font-size:calc(13px * var(--fs));">${totals.map((t, i) => `<span style="background:#fff;border:1px solid ${col}55;border-radius:999px;padding:2px 10px;">ส.${i + 1} <strong>${t}</strong></span>`).join('')}<span style="background:#fff;border:1px solid #8884;border-radius:999px;padding:2px 10px;">จิตพิสัย <strong>30</strong></span></div>
    <div style="margin-top:6px;font-size:calc(13px * var(--fs));line-height:1.6;color:${col};">${msg}</div>
  </div>`;
}
function rptLinkOptions(s, it) {
  const kind = rptKind(it), cur = it.link, mode = rptMode(it);
  let o = `<option value="" ${mode === 'auto' ? 'selected' : ''}>⚙ อัตโนมัติ: ${kind === 'theory' ? 'ปัญญา → คะแนนสอบ' : (rptFocus(it) === 'creative' ? 'สร้างสรรค์' : rptFocus(it) === 'mix' ? ('ทักษะ+สร้างสรรค์ ' + rptSkillW(s.report) + ':' + (100 - rptSkillW(s.report))) : 'ทักษะ') + ' → คะแนนปฏิบัติ'}</option>`;
  o += `<option value="manual" ${mode === 'manual' ? 'selected' : ''}>✎ กรอกคะแนนเอง</option>`;
  if (kind === 'practice' && s.assignments.length) {
    o += '<optgroup label="ผูกกับชิ้นงานปฏิบัติ (คะแนนลงมือทำ)">';
    s.assignments.forEach(a => {
      const tot = a.rubric.reduce((t, x) => t + (Number(x.max) || 0), 0), v = `a:${a.assignment_id}:total`;
      o += `<option value="${v}" ${cur === v ? 'selected' : ''}>${escapeHtml(a.title)} — คะแนนรวม (เต็ม ${tot})</option>`;
      a.rubric.forEach((x, i) => { const v2 = `a:${a.assignment_id}:${i}`; o += `<option value="${v2}" ${cur === v2 ? 'selected' : ''}>${escapeHtml(a.title)} › ${escapeHtml(x.name)} (เต็ม ${x.max})</option>`; });
    });
    o += '</optgroup>';
  }
  if (kind === 'theory' && s.exams.length) {
    o += '<optgroup label="ผูกกับข้อสอบ (คะแนนสอบ)">';
    s.exams.forEach((ex, i) => { const v = `e:${i}`; o += `<option value="${v}" ${cur === v ? 'selected' : ''}>${escapeHtml(ex.title)} (เต็ม ${ex.questions.length})</option>`; });
    o += '</optgroup>';
  }
  return o;
}
function rptCompsHtml(s, r) {
  const totals = rptCompTotals(r), grand = totals.reduce((a, b) => a + b, 0);
  const impOpts = '<option value="">— นำเกณฑ์ของชิ้นงานมาเป็นข้อ (ปฏิบัติ) —</option>' + s.assignments.map(a => `<option value="${a.assignment_id}">${escapeHtml(a.title)} (${a.rubric.length} เกณฑ์)</option>`).join('');
  const blocks = r.comps.map((c, ci) => `
    <div style="border-top:1px solid var(--line);padding-top:10px;margin-top:12px;">
      <div class="hd" style="font-size:calc(17px * var(--fs));color:var(--red);">สมรรถนะ ${ci + 1} <span class="meta">· เต็ม ${totals[ci]} คะแนน</span></div>
      <label>ชื่อหน่วยการเรียน / สมรรถนะ</label>
      <input value="${escapeHtml(c.unit)}" onchange="rptSetUnit(${ci}, this.value)">
      ${c.items.map((it, k) => {
        const kind = rptKind(it), mode = rptMode(it), lm = mode === 'link' ? rptLinkMax(s, it.link) : null;
        let info = '';
        if (mode === 'link') info = lm ? `<div class="meta" style="margin:4px 0 0;color:#1B5E7A;">🔗 คะแนนดิบเต็ม ${lm} → ปรับเป็นเต็ม ${it.max}${lm !== Number(it.max) ? ` (×${(it.max / lm).toFixed(2)})` : ''} อัตโนมัติ</div>` : '<div class="meta" style="margin:4px 0 0;color:#B3261E;">ที่มาที่ผูกไว้ไม่มีแล้ว — เลือกใหม่</div>';
        else if (mode === 'auto') info = `<div class="meta" style="margin:4px 0 0;color:#3B6D11;">⚙ ${rptAutoText(it, r)} (เต็ม ${RPT_ABILITY_CAP}) → ปรับเป็นเต็ม ${it.max} อัตโนมัติ</div>`;
        const bg = mode === 'link' ? '#EEF6FA' : mode === 'auto' ? '#F1F7EC' : '#fff';
        const fb = (v, label) => `<button class="btn sm ${rptFocus(it) === v ? 'gold' : 'outline'}" style="margin:0;flex:1;padding:7px 4px;" onclick="rptSetFocus(${ci},${k},'${v}')">${label}</button>`;
        const sub = (kind === 'practice' && mode === 'auto') ? `<div style="display:flex;gap:6px;margin-top:6px;align-items:center;"><span class="meta" style="white-space:nowrap;">อิงค่า:</span>${fb('skill', '✋ ทักษะ')}${fb('creative', '💡 สร้างสรรค์')}${fb('mix', '⚖ ผสม ' + rptSkillW(r) + ':' + (100 - rptSkillW(r)))}</div>` : '';
        const kb = (v, label) => `<button class="btn sm ${kind === v ? 'gold' : 'outline'}" style="margin:0;flex:1;padding:8px 6px;" onclick="rptSetKind(${ci},${k},'${v}')">${label}</button>`;
        return `
        <div style="margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:${bg};">
          <div class="rubric-item">
            <input value="${escapeHtml(it.name)}" onchange="rptSetItem(${ci},${k},'name',this.value)">
            <input class="max" type="number" min="0" inputmode="numeric" value="${it.max}" onchange="rptSetItem(${ci},${k},'max',this.value)">
            <button class="btn outline sm" style="margin:0;" onclick="rptDelItem(${ci},${k})" aria-label="ลบข้อ">✕</button>
          </div>
          <div style="display:flex;gap:6px;margin-top:6px;">${kb('theory', '📖 ทฤษฎี · คะแนนสอบ')}${kb('practice', '🎨 ปฏิบัติ · ลงมือทำ')}</div>
          <select style="margin-top:6px;" onchange="rptSetLink(${ci},${k},this.value)">${rptLinkOptions(s, it)}</select>
          ${sub}
          ${info}
        </div>`; }).join('')}
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;">
        ${c.items.length < rptSlots(s)[ci] ? `<button class="btn outline sm" style="margin:0;" onclick="rptAddItem(${ci})">+ เพิ่มข้อ</button>` : '<span class="meta">ครบจำนวนช่องในฟอร์มแล้ว (' + rptSlots(s)[ci] + ' ข้อ)</span>'}
        ${s.assignments.length ? `<select style="width:auto;max-width:100%;" onchange="rptImportAsg(${ci}, this.value); this.value=''">${impOpts}</select>` : ''}
      </div>
    </div>`).join('');
  return `<div class="card">
    <h2>สมรรถนะและหน่วยการเรียน</h2>
    ${rptTotalBoxHtml(r)}

      📖 ข้อ <strong>ทฤษฎี</strong> = รูปแบบคะแนนสอบ ← ค่า <strong>ปัญญา</strong><br>
      🎨 ข้อ <strong>ปฏิบัติ</strong> = รูปแบบคะแนนลงมือทำ ← เลือกอิงรายข้อได้: <strong>✋ ทักษะ</strong> · <strong>💡 สร้างสรรค์</strong> (ครูกำหนดเอง) · <strong>⚖ ผสม</strong> (ทักษะ ${rptSkillW(r)}% + สร้างสรรค์ ${100 - rptSkillW(r)}%)<br>
      🕘 <strong>จิตพิสัย 30 คะแนน</strong> ← เฉลี่ย <strong>ความเร็ว + ตรงต่อเวลา + ความเพียร</strong><br>
      แต่ละข้อเลือกให้ผูกกับข้อสอบ/ชิ้นงานจริงแทนได้ หรือกรอกเอง
    </div>
    <div class="meta" style="margin-top:6px;line-height:1.7;background:#EEF6FA;border-radius:8px;padding:8px;">🔗 <strong>การผูกกับชิ้นงานหรือข้อสอบ</strong> คำนวณให้เอง: คะแนนที่ทำได้ ÷ คะแนนเต็มของที่มา × คะแนนเต็มของข้อ (เช่น ได้ 12 จาก 15 แต่ข้อนี้เต็ม 5 → 4) ถ้าทำหลายครั้งใช้ครั้งที่ได้สูงสุด</div>
    ${blocks}
  </div>`;
}
function rptRerenderAll() { const s = curSubject(), r = ensureReport(s); byId('rpt_comps').innerHTML = rptCompsHtml(s, r); rptRefreshScores(); }
function rptSetUnit(ci, v) { ensureReport(curSubject()).comps[ci].unit = v.trim(); }
function rptSetItem(ci, k, f, v) {
  const it = ensureReport(curSubject()).comps[ci].items[k];
  if (f === 'max') it.max = Math.max(0, Number(v) || 0); else it.name = v.trim();
  rptRerenderAll();
}
function rptAddItem(ci) { const c = ensureReport(curSubject()).comps[ci]; if (c.items.length < rptSlots(curSubject())[ci]) c.items.push({ name: 'ข้อที่ ' + (c.items.length + 1), max: 5, kind: 'practice', focus: 'skill' }); rptRerenderAll(); }
function rptDelItem(ci, k) {
  const r = ensureReport(curSubject()); r.comps[ci].items.splice(k, 1);
  Object.values(r.scores).forEach(sc => { if (sc.c[ci]) sc.c[ci].splice(k, 1); });
  rptRerenderAll();
}
function rptSetLink(ci, k, v) {
  const it = ensureReport(curSubject()).comps[ci].items[k];
  if (v === 'manual') { it.link = null; it.manual = true; } else if (!v) { it.link = null; it.manual = false; } else { it.link = v; it.manual = false; }
  rptRerenderAll();
}
function rptSetFocus(ci, k, f) { ensureReport(curSubject()).comps[ci].items[k].focus = f; rptRerenderAll(); }
function rptSetKind(ci, k, kind) {
  const it = ensureReport(curSubject()).comps[ci].items[k];
  if (rptKind(it) === kind) return;
  it.kind = kind;
  if (it.link) { const t = it.link.split(':')[0]; if ((kind === 'theory' && t === 'a') || (kind === 'practice' && t === 'e')) it.link = null; } // ที่มาไม่ตรงชนิด → กลับเป็นอัตโนมัติ
  rptRerenderAll();
}
function rptSetConductMode(m) { ensureReport(curSubject()).conductMode = m; rptRefreshScores(); }
function rptImportAsg(ci, aid) {
  if (!aid) return;
  const s = curSubject(), r = ensureReport(s), c = r.comps[ci];
  const a = s.assignments.find(x => x.assignment_id === aid); if (!a) return;
  c.items = a.rubric.slice(0, rptSlots(s)[ci]).map((x, i) => ({ name: x.name, max: x.max, kind: 'practice', focus: 'skill', link: `a:${aid}:${i}` }));
  if (!c.unit) c.unit = a.title;
  rptRerenderAll();
}

// ---------- กรอกคะแนน ----------
function rptScoresHtml(s, r) {
  const tabs = r.comps.map((c, i) => `<span class="subj-chip ${RPT_VIEW.tab === i ? 'active' : ''}" onclick="rptTab(${i})">สมรรถนะ ${i + 1}</span>`).join('')
    + `<span class="subj-chip ${RPT_VIEW.tab === 5 ? 'active' : ''}" onclick="rptTab(5)">จิตพิสัย</span>`;
  const ti = RPT_VIEW.tab;
  const students = rosterFor(s.subject_id);
  if (!students.length) return '<p style="color:#999;">ยังไม่มีนักเรียนในรายชื่อ</p>';
  const nameOf = st => { const nm = splitName(st.full_name); return escapeHtml((st.prefix || '') + nm.first + ' ' + nm.last); };
  let head, body, extra = '';
  if (ti < 5) {
    const c = r.comps[ti];
    head = `<th>นักเรียน</th>` + c.items.map(it => `<th style="min-width:80px;">${escapeHtml(it.name)}<div class="meta">${rptKind(it) === 'theory' ? '📖 ทฤษฎี' : '🎨 ปฏิบัติ'} · เต็ม ${it.max}${it.link ? ' 🔗' : ''}</div></th>`).join('') + `<th>รวม</th>`;
    body = students.map(st => {
      const sc = rptStu(r, st.student_id);
      return `<tr><td>${nameOf(st)}</td>` +
        c.items.map((it, k) => {
          const mode = rptMode(it), v = rptItemVal(s, r, st, ti, k);
          if (mode === 'link') {
            const rw = rptRaw(s, st, it.link);
            return `<td style="background:#EEF6FA;">${rw ? `<strong>${v}</strong><div class="meta">${rw.raw}/${rw.max}</div>` : '<span class="meta">ยังไม่มี</span>'}</td>`;
          }
          if (mode === 'auto') {
            const ab = rptKindAbility(st, rptKind(it), r, rptFocus(it));
            return `<td style="background:#F1F7EC;"><strong>${v}</strong><div class="meta">${ab.label} ${Math.round(ab.v * 10) / 10}/${RPT_ABILITY_CAP}</div></td>`;
          }
          return `<td><input type="number" inputmode="decimal" min="0" max="${it.max}" step="0.5" style="width:62px;padding:6px;" value="${sc.c[ti][k] != null && sc.c[ti][k] !== '' ? sc.c[ti][k] : ''}" onchange="rptSetScore('${st.student_id}',${ti},${k},this.value,${it.max})"></td>`;
        }).join('') +
        `<td><strong id="rt_${st.student_id}">${rptRowTotal(r, st.student_id, ti)}</strong></td></tr>`;
    }).join('');
    extra = '<div class="meta" style="margin-top:8px;line-height:1.7;">ช่องสีเขียว = อัตโนมัติจากค่าความสามารถ (บรรทัดเล็กคือค่าที่ใช้) · ช่องสีฟ้า 🔗 = คำนวณจากชิ้นงาน/ข้อสอบ (ที่ได้/เต็ม) · ช่องขาว = กรอกเอง · เปลี่ยนที่มาของแต่ละข้อได้ในส่วน "สมรรถนะและหน่วยการเรียน" ด้านบน</div>';
  } else if (r.conductMode !== 'manual') {
    head = '<th>นักเรียน</th><th>ความเร็ว</th><th>ตรงต่อเวลา</th><th>ความเพียร</th><th>เฉลี่ย</th><th>จิตพิสัย (30)</th>';
    body = students.map(st => {
      const items = rptConductItems(st, r), tot = items.reduce((a, b) => a + b, 0);
      return `<tr><td>${nameOf(st)}</td><td>${Math.round(rptAbVal(st, 'speed') * 10) / 10}</td><td>${Math.round(rptAbVal(st, 'punctuality') * 10) / 10}</td><td>${Math.round(rptAbVal(st, 'perseverance') * 10) / 10}</td><td>${(Math.round(rptConductAvg(st) * 10) / 10).toFixed(1)}</td><td style="background:#F1F7EC;"><strong>${Number(tot.toFixed(1))}</strong></td></tr>`;
    }).join('');
    extra = `<div class="meta" style="margin-top:8px;line-height:1.7;">⚙ จิตพิสัยคำนวณอัตโนมัติ = เฉลี่ย ความเร็ว + ตรงต่อเวลา + ความเพียร (ค่าเต็ม ${RPT_ABILITY_CAP} = จิตพิสัย 30 คะแนน) แล้วกระจายลง 10 ข้อของฟอร์มให้ผลรวมเท่ากัน ข้อละไม่เกิน 3</div>
      <button class="btn outline sm" style="margin-top:8px;" onclick="rptSetConductMode('manual')">✎ เปลี่ยนเป็นกรอกเอง 10 ข้อ</button>`;
  } else {
    head = `<th>นักเรียน</th>` + RPT_CONDUCT.map((n, k) => `<th style="min-width:70px;">${escapeHtml(n)}<div class="meta">เต็ม 3</div></th>`).join('') + `<th>รวม</th>`;
    body = students.map(st => {
      const sc = rptStu(r, st.student_id);
      return `<tr><td>${nameOf(st)}</td>` +
        RPT_CONDUCT.map((n, k) => `<td><input type="number" inputmode="decimal" min="0" max="3" step="0.5" style="width:62px;padding:6px;" value="${sc.j[k] != null && sc.j[k] !== '' ? sc.j[k] : ''}" onchange="rptSetScore('${st.student_id}',5,${k},this.value,3)"></td>`).join('') +
        `<td><strong id="rt_${st.student_id}">${rptRowTotal(r, st.student_id, 5)}</strong></td></tr>`;
    }).join('');
    extra = `<div class="meta" style="margin-top:8px;">จิตพิสัย 10 ข้อ ข้อละ 3 คะแนน รวม 30 คะแนน (กรอกเอง)</div>
      <button class="btn outline sm" style="margin-top:8px;" onclick="rptSetConductMode('auto')">⚙ กลับไปใช้อัตโนมัติจากความสามารถ</button>`;
  }
  return `<div style="margin-bottom:8px;">${tabs}</div>
    <div style="overflow-x:auto;"><table class="rpt-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${extra}`;
}
function rptRowTotal(r, sid, ti) {
  const s = curSubject(), st = DEMO.roster.find(x => x.student_id === sid), sc = rptStu(r, sid);
  if (ti < 5) return r.comps[ti].items.reduce((a, it, k) => a + (Number(rptItemVal(s, r, st, ti, k)) || 0), 0);
  if (r.conductMode !== 'manual') return Number(rptConductItems(st, r).reduce((a, b) => a + b, 0).toFixed(1));
  return sc.j.reduce((a, v) => a + Math.min(Number(v) || 0, 3), 0);
}
function creativityVal(st) { return Math.round(rptAbVal(st, 'creativity') * 10) / 10; }
function setCreativity(sid, val) {
  const st = DEMO.roster.find(x => x.student_id === sid); if (!st) return;
  if (val === '' || isNaN(Number(val))) return;
  st.ability.creativity = Math.max(0, Math.min(RPT_ABILITY_CAP, Number(val)));
  if (byId('rpt_scores')) { rptRefreshScores(); const el = byId('cr_' + sid); if (el) el.value = creativityVal(st); }
  else openStudentDetail(sid);
}
function rptCreativityHtml() {
  const rows = rosterFor(CURRENT_SUBJECT_ID).map(st => { const nm = splitName(st.full_name);
    return `<tr><td>${escapeHtml((st.prefix || '') + nm.first + ' ' + nm.last)}</td><td><input id="cr_${st.student_id}" type="number" min="0" max="${RPT_ABILITY_CAP}" step="1" inputmode="decimal" style="width:72px;padding:6px;" value="${creativityVal(st)}" onchange="setCreativity('${st.student_id}', this.value)"> <span class="meta">/ ${RPT_ABILITY_CAP}</span></td></tr>`; }).join('');
  return `<h2>คะแนนสร้างสรรค์ (ครูกำหนด)</h2>
    <div class="meta" style="line-height:1.7;">ให้คะแนนความสร้างสรรค์ของนักเรียนแต่ละคนเองหลังดูผลงาน (0–${RPT_ABILITY_CAP}) ค่านี้ไปแสดงในกราฟความสามารถด้วย และเข้าสู่คะแนนข้อ "ปฏิบัติ" ตามน้ำหนักที่ตั้งไว้</div>
    <div style="overflow-x:auto;margin-top:8px;"><table class="rpt-table"><thead><tr><th>นักเรียน</th><th>สร้างสรรค์</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function rptTab(i) { RPT_VIEW.tab = i; rptRefreshScores(); }
function rptRefreshScores() { const s = curSubject(), r = ensureReport(s); byId('rpt_scores').innerHTML = rptScoresHtml(s, r); rptRefreshSummary(); }
function rptSetScore(sid, ti, k, val, max) {
  const r = ensureReport(curSubject()), sc = rptStu(r, sid);
  let v = val === '' ? null : Math.max(0, Math.min(Number(val) || 0, max));
  if (ti < 5) sc.c[ti][k] = v; else sc.j[k] = v;
  const el = byId('rt_' + sid); if (el) el.textContent = rptRowTotal(r, sid, ti);
  if (v != null && v !== Number(val)) rptRefreshScores(); // ปรับค่าที่เกินคะแนนเต็มให้พอดี
  rptRefreshSummary();
}

function rptSummaryHtml(s, r) {
  const data = reportDataForSubject(s);
  if (!data.students.length) return '<p style="color:#999;">ยังไม่มีนักเรียนในรายชื่อ</p>';
  const rows = data.students.map((st, i) => {
    const c = xlCompute(data, st);
    return `<tr><td>${i + 1}</td><td style="text-align:left;">${escapeHtml(st.prefix + st.first + ' ' + st.last)}</td>${c.comp.map(v => `<td>${v}</td>`).join('')}<td><strong>${c.part70}</strong></td><td>${c.conduct}</td><td><strong>${c.total}</strong></td><td><strong style="color:${c.grade === 0 ? '#B3261E' : 'var(--red)'};">${c.grade}</strong></td></tr>`;
  }).join('');
  const comp = data.students.map(st => xlCompute(data, st));
  const cnt = g => data.students.filter(st => st.gender === g).length;
  const pass = g => data.students.filter((st, i) => st.gender === g && comp[i].total >= 50).length;
  return `<div style="overflow-x:auto;"><table class="rpt-table"><thead><tr><th>ที่</th><th>ชื่อ - สกุล</th><th>ส.1</th><th>ส.2</th><th>ส.3</th><th>ส.4</th><th>ส.5</th><th>รวม (70)</th><th>จิตพิสัย (30)</th><th>รวม (100)</th><th>เกรด</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="meta" style="margin-top:8px;line-height:1.8;">รวม ชาย <strong>${cnt('M')}</strong> คน · หญิง <strong>${cnt('F')}</strong> คน<br>ผ่าน (คะแนนรวม ≥ 50) ชาย <strong>${pass('M')}</strong> คน · หญิง <strong>${pass('F')}</strong> คน</div>`;
}
function rptRefreshSummary() { const s = curSubject(), r = ensureReport(s); if (byId('rpt_summary')) byId('rpt_summary').innerHTML = rptSummaryHtml(s, r); rptRefreshExport(); }

// ---------- นำออก ----------
function rptIssues(s, r) {
  const data = reportDataForSubject(s), out = [];
  const form = rptForm(s), attCols = rptAttCols(s);
  if (!form) out.push({ block: true, text: 'ระดับ ' + s.level + ' ยังไม่มีแบบฟอร์มในระบบ' });
  if (!r.start || !r.end) out.push({ block: true, text: 'ระบุวันเริ่มเรียนและวันสิ้นสุดก่อน' });
  if (data.students.length === 0) out.push({ block: true, text: 'ยังไม่มีนักเรียนในรายชื่อ' });
  if (data.students.length > XL_CAPACITY) out.push({ block: false, text: `ฟอร์มมี ${XL_CAPACITY} แถว จะนำออก ${XL_CAPACITY} คนแรก` });
  if (data.dates.length === 0) out.push({ block: false, text: 'ยังไม่มีการบันทึกเวลาเรียนของวิชานี้ (ช่องเวลาเรียนจะว่าง)' });
  if (data.dates.length > attCols) out.push({ block: false, text: `ฟอร์มมี ${attCols} ช่องวันที่ จะนำออก ${attCols} วันแรก` });
  const grand = rptCompTotals(r).reduce((a, b) => a + b, 0);
  if (grand > 70) out.push({ block: true, text: `คะแนนสมรรถนะรวม ${grand} เกิน 70 (ไปทับจิตพิสัย 30) — ลดคะแนนเต็มของข้อก่อนนำออก` });
  else if (grand < 70) out.push({ block: false, text: `คะแนนสมรรถนะรวม ${grand} ยังไม่ถึง 70` });

function rptExportHtml(s, r) {

async function rptExport() {

    const d = Object.assign({}, data, { students: data.students.slice(0, XL_CAPACITY) });

}

<script>
// ============================== ซูมเข้า/ออก ==============================
(function () {
  const MIN = 0.7, MAX = 2.0;
  let z = 1;
  try { const v = parseFloat(localStorage.getItem('bps_zoom')); if (v >= MIN && v <= MAX) z = v; } catch (e) {}
  function apply(save) {
    z = Math.max(MIN, Math.min(MAX, Math.round(z * 100) / 100));
    const app = document.getElementById('app');
    if (app) app.style.zoom = z;
    const pct = document.getElementById('zoom_pct');
    if (pct) pct.textContent = Math.round(z * 100) + '%';
    if (save) { try { localStorage.setItem('bps_zoom', String(z)); } catch (e) {} }
  }
  window.zoomBy = d => { z += d; apply(true); };
  window.zoomSet = v => { z = v; apply(true); };
  // ถ่างสองนิ้วเพื่อซูม
  let d0 = 0, z0 = 1;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  document.addEventListener('touchstart', e => { if (e.touches.length === 2) { d0 = dist(e.touches); z0 = z; } }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && d0) { e.preventDefault(); z = z0 * dist(e.touches) / d0; apply(false); }
  }, { passive: false });
  document.addEventListener('touchend', e => { if (d0 && e.touches.length < 2) { d0 = 0; apply(true); } });
  // คอมพิวเตอร์: กด Ctrl (หรือ ⌘ บน Mac) ค้างไว้แล้วกลิ้งล้อเมาส์ / ถ่างสองนิ้วบนทัชแพด
  let saveT = null;
  window.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    z *= Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.04 : 0.0012));
    apply(false);
    clearTimeout(saveT); saveT = setTimeout(() => apply(true), 250);
  }, { passive: false });
  // คีย์ลัด Ctrl/⌘ + (+ / - / 0)
  window.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomBy(0.1); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomBy(-0.1); }
    else if (e.key === '0') { e.preventDefault(); zoomSet(1); }
  });
  const pctBtn = document.getElementById('zoom_pct');
  if (pctBtn) pctBtn.title = 'กลับเป็น 100% · บนคอม: Ctrl + ล้อเมาส์ เพื่อซูม';
  apply(false);
})();
</script>
<script>

// โหลดต่อท้ายสคริปต์หลักของแอป: เปลี่ยนจากข้อมูลสาธิตในหน้า เป็นข้อมูลจริงจากชีต
const APP_CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbz3u6zkBh250N0HheTo-pnSdceKGMx6AHQ9ztIw0ip5L8ljlf7_nssS3s0fCG0QhxeCdw/exec' };   // ใส่ลิงก์ Web App (ลงท้าย /exec) ที่นี่ได้ ถ้าเว้นว่างแอปจะถามตอนเปิดครั้งแรก

const APP_VERSION = 'phase1-1.0.0';

const LS = {

/* ---------------- เรียก API ---------------- */
function apiUrl() {

const Q_KEY = 'bps_queue_v1';

    return;

}
async function flush() {
  if (flushing) return;

        toast('บันทึกไม่สำเร็จ: ' + e.message, true);

function wrap(name, after) {
  const orig = window[name]; if (typeof orig !== 'function') return;
  window[name] = function () { const r = orig.apply(this, arguments); try { after.apply(this, arguments); } catch (e) { console.error(name, e); } return r; };
}
function rosterFor(subjectId) {

async function saveBlobFile(name, blob) {
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

    if (ch.some(c => !c)) { issues.push(label + 'ตัวเลือกไม่ครบ 4 ข้อ — ข้าม'); return; }
    const ci = examAnswerIndex(ans, ch);

function blankQuestion() { return { question: '', choices: ['', '', '', ''], correct_index: 0 }; }
function addExamQuestion(sid, idx) {
  const ex = findSubject(sid).exams[idx];

  setTimeout(() => { const t = document.querySelectorAll('#subject-tab-body textarea'); if (t.length) t[t.length - 1].focus(); }, 50);

function updateExamMeta(sid, idx, field, value) {

async function startExam(sid, idx) {
  const s = findSubject(sid), ex = s.exams[idx];
  try {
    toast('กำลังเริ่มข้อสอบ…');
    const r = await api('startExam', { exam_id: ex.exam_id });
    const now = Date.now();
    EXAM_RUNNER = { subjectId: sid, examIndex: idx, answers: new Array(ex.questions.length).fill(null), startAt: now - (ex.duration_minutes * 60000 - r.remaining_ms), endAt: now + r.remaining_ms, submitted: false };
    renderExamQuestion(0); tickExamTimer();
    if (r.resumed) toast('กลับมาทำต่อ — เวลานับต่อจากเดิม');
  } catch (e) { toast(e.network ? 'ต้องออนไลน์เพื่อเริ่มทำข้อสอบ' : e.message, true); }
}
async function submitExam(timedOut) {
  if (!EXAM_RUNNER || EXAM_RUNNER.submitted) return;
  const R = EXAM_RUNNER; R.submitted = true;
  const s = findSubject(R.subjectId), ex = s.exams[R.examIndex];
  byId('student-body').innerHTML = '<div class="card"><h2>กำลังส่งคำตอบ…</h2><p class="meta">อย่าปิดหน้านี้</p></div>';
  try {
    const r = await api('submitExam', { exam_id: ex.exam_id, answers: R.answers, timed_out: !!timedOut });
    const st = DEMO.student;
    st.exam_attempts.push({ subject_id: R.subjectId, exam_index: R.examIndex, score: r.score, total: r.total, timed_out: r.timed_out, submitted_at: new Date().toISOString() });
    st.ability.intelligence = r.progress.intelligence; st.ability.speed = r.progress.speed; st.rank_points = r.progress.rank_points;
    const review = ex.questions.map((q, i) => {
      const mine = R.answers[i], good = r.review[i], ok = mine === good;
      return `<div class="row" style="align-items:flex-start;"><div style="flex:1;"><div style="font-weight:600;">${i + 1}. ${escapeHtml(q.question)}</div>
        <div class="meta">${ok ? '✅ ตอบถูก' : '❌ คุณตอบ ' + (mine == null ? '— (ไม่ได้ตอบ)' : String.fromCharCode(65 + mine) + '. ' + escapeHtml(q.choices[mine])) + ' · เฉลย ' + String.fromCharCode(65 + good) + '. ' + escapeHtml(q.choices[good])}</div></div></div>`;
    }).join('');
    byId('student-body').innerHTML = `<div class="card">
      <h2>${r.timed_out ? 'หมดเวลา — ส่งอัตโนมัติ' : 'ส่งคำตอบแล้ว'}</h2>
      <p style="font-size:calc(28px * var(--fs));font-weight:700;color:var(--red);text-align:center;margin:10px 0;">${r.score} / ${r.total}</p>
      <p style="text-align:center;color:#777;font-size:calc(13px * var(--fs));">ด้านปัญญา +${r.gains.intelligence} คะแนน${r.gains.speed ? ' · ความเร็ว +' + r.gains.speed + ' (ทำเสร็จภายในครึ่งเวลา)' : ''} · แต้มสำนัก +${r.gains.rank_points}</p>
      <button class="btn gold" style="width:100%;" onclick="renderStudentExamList()">กลับไปหน้ารายการข้อสอบ</button></div>
      <div class="card"><h2>เฉลย</h2>${review}</div>`;
    EXAM_RUNNER = null;
  } catch (e) {
    byId('student-body').innerHTML = `<div class="card"><h2>ส่งคำตอบไม่สำเร็จ</h2>
      <p style="color:#8A1C1C;">${escapeHtml(e.network ? 'ออฟไลน์ หรือเชื่อมต่อเซิร์ฟเวอร์ไม่ได้' : e.message)}</p>
      ${e.network ? `<p class="meta">คำตอบของคุณยังอยู่ในเครื่อง ต่อสัญญาณแล้วกดส่งอีกครั้ง</p><button class="btn gold" style="width:100%;" onclick="retrySubmitExam(${timedOut ? 'true' : 'false'})">ส่งอีกครั้ง</button>`
              : '<button class="btn gold" style="width:100%;" onclick="EXAM_RUNNER=null;renderStudentExamList()">กลับไปหน้ารายการข้อสอบ</button>'}</div>`;
    if (!e.network) EXAM_RUNNER = null;
  }
}
function retrySubmitExam(timedOut) { if (EXAM_RUNNER) { EXAM_RUNNER.submitted = false; submitExam(timedOut); } }

function asgOf(sid, idx) { const s = findSubject(sid); return s && s.assignments[idx]; }

function asgPendingCount(sid, aid) { let n = 0; DEMO.roster.forEach(st => st.pending_subs.forEach(p => { if (p.subject_id === sid && p.assignment_id === aid) n++; })); return n; }
function gradedCount(sid, aid) { let n = 0; DEMO.roster.forEach(st => st.submissions.forEach(p => { if (p.subject_id === sid && p.assignment_id === aid) n++; })); return n; }

/* ---------------- ย่อรูปงาน ---------------- */
function readWorkImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let d = c.toDataURL('image/jpeg', 0.6); if (d.length > 140000) d = c.toDataURL('image/jpeg', 0.4); if (d.length > 145000) { c.width = Math.round(c.width * .7); c.height = Math.round(c.height * .7); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); d = c.toDataURL('image/jpeg', 0.4); }
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('อ่านไฟล์รูปไม่ได้')); };
    img.src = url;
  });
}

        <div style="margin-top:4px;">${rptBadges(s, 'a', a.assignment_id).trim()}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
          <button class="btn gold sm" style="margin:0;" onclick="openGradeList('${s.subject_id}',${i})">${pend ? 'ตรวจงาน (' + pend + ')' : 'ดูงานที่ส่ง'}</button>
          <button class="btn outline sm" style="margin:0;" onclick="openAsgEdit('${s.subject_id}',${i})">✎ แก้ไข</button>
          <button class="btn outline sm" style="margin:0;" id="asgdel_${i}" onclick="deleteAsg('${s.subject_id}',${i})">🗑 ลบ</button>
        </div></div></div>`;
  }).join('') || '<p style="color:#999;font-size:calc(13.5px * var(--fs));">ยังไม่มีหัวข้อชิ้นงาน</p>';
  byId('subject-tab-body').innerHTML = `
    <div class="card"><h2>หัวข้อชิ้นงานทั้งหมด</h2>${rows}</div>
    <div class="card" id="asg_form"><h2 id="asg_form_title">เพิ่มหัวข้อชิ้นงานใหม่</h2>
      <label>ชื่อชิ้นงาน</label><input id="asg_title" placeholder="เช่น ภาพเครื่องทรง ชฎาเดินหน">
      <label>รายละเอียด/โจทย์ (ไม่บังคับ)</label><textarea id="asg_desc" rows="3" placeholder="บอกขนาด วัสดุ สิ่งที่ต้องส่ง"></textarea>
      <label>กำหนดส่ง</label>${dateField('asg_due', '')}
      <label>เกณฑ์ให้คะแนน (ชื่อเกณฑ์ + คะแนนเต็ม)</label>
      <div id="rubric-list">
        <div class="rubric-item"><input placeholder="ความถูกต้องตามแบบแผน" value="ความถูกต้องตามแบบแผน"><input class="max" type="number" value="15"></div>
        <div class="rubric-item"><input placeholder="สัดส่วน" value="สัดส่วน"><input class="max" type="number" value="10"></div>
        <div class="rubric-item"><input placeholder="คุณภาพเส้น" value="คุณภาพเส้น"><input class="max" type="number" value="10"></div>
      </div>
      <button class="btn outline sm" onclick="addRubricRow()" style="margin-top:8px;">+ เพิ่มเกณฑ์</button>
      <div id="asg_err" class="error-msg"></div>
      <div style="display:flex;gap:8px;"><button class="btn gold" style="margin:0;flex:1;" id="asg_save" onclick="addAssignmentDemo('${s.subject_id}')">บันทึกหัวข้อชิ้นงาน</button><button class="btn outline" id="asg_cancel" style="margin:0;display:none;" onclick="renderAssignmentTab(findSubject('${s.subject_id}'))">ยกเลิกแก้ไข</button></div>
    </div>`;
}
let ASG_EDIT = null;
function openAsgEdit(sid, idx) {
  const s = findSubject(sid), a = s.assignments[idx]; ASG_EDIT = a.assignment_id;
  renderAssignmentTab(s);
  byId('asg_form_title').textContent = 'แก้ไขหัวข้อชิ้นงาน'; byId('asg_title').value = a.title; byId('asg_desc').value = a.description || '';
  pickCalDate('asg_due', a.due_at || '');
  const list = byId('rubric-list'); list.innerHTML = '';
  a.rubric.forEach(r => { const d = document.createElement('div'); d.className = 'rubric-item'; d.innerHTML = `<input value="${escapeHtml(r.name)}"><input class="max" type="number" value="${r.max}">`; list.appendChild(d); });
  byId('asg_cancel').style.display = ''; byId('asg_save').textContent = 'บันทึกการแก้ไข';
  if (gradedCount(sid, a.assignment_id)) byId('asg_err').innerHTML = '<span style="color:#8a6d00;">มีงานที่ตรวจแล้ว — แก้เกณฑ์/คะแนนเต็มไม่ได้ (แก้ชื่อ โจทย์ และกำหนดส่งได้)</span>';
  byId('asg_form').scrollIntoView({ behavior: 'smooth' });
}
async function addAssignmentDemo(sid) {
  const s = findSubject(sid), err = byId('asg_err'), title = byId('asg_title').value.trim();
  if (!title) { err.textContent = 'ตั้งชื่อชิ้นงานก่อน'; return; }
  const rubric = Array.from(byId('rubric-list').children).map(row => { const i = row.querySelectorAll('input'); return { name: i[0].value.trim() || 'เกณฑ์', max: parseInt(i[1].value, 10) || 10 }; });
  const assignment = { assignment_id: ASG_EDIT || undefined, title, description: byId('asg_desc').value.trim(), due_at: byId('asg_due').value, rubric };
  err.textContent = 'กำลังบันทึก…';
  try {
    const r = await api('saveAssignment', { subject_id: sid, assignment });
    const meta = { assignment_id: r.assignment_id, subject_id: sid, title, description: assignment.description, due_at: assignment.due_at, rubric };
    const i = s.assignments.findIndex(a => a.assignment_id === r.assignment_id);
    if (i >= 0) s.assignments[i] = Object.assign(s.assignments[i], meta); else s.assignments.push(meta);
    ASG_EDIT = null; renderAssignmentTab(s);
  } catch (e) { err.textContent = e.network ? 'ออฟไลน์ — บันทึกหัวข้อต้องออนไลน์' : e.message; }
}
async function deleteAsg(sid, idx) {
  const s = findSubject(sid), a = s.assignments[idx], btn = byId('asgdel_' + idx);
  if (btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = 'ยืนยันลบ?'; return; }
  try { await api('deleteAssignment', { assignment_id: a.assignment_id, force: true }); await refreshFromServer(); renderAssignmentTab(findSubject(sid)); }
  catch (e) { toast(e.network ? 'ออฟไลน์ — ลบต้องออนไลน์' : e.message, true); }
}

/* ---------------- ครู: ตรวจงาน ---------------- */
function submissionList(sid, aid) {
  const out = [];
  DEMO.roster.forEach(st => {
    st.pending_subs.forEach(p => { if (p.subject_id === sid && p.assignment_id === aid) out.push({ st, status: 'submitted', sub: p }); });
    st.submissions.forEach(p => { if (p.subject_id === sid && p.assignment_id === aid) out.push({ st, status: 'graded', sub: p }); });
  });
  return out.sort((x, y) => (x.status === 'submitted' ? 0 : 1) - (y.status === 'submitted' ? 0 : 1) || String(x.st.seat_no).localeCompare(String(y.st.seat_no), 'th', { numeric: true }));
}
function openGradeList(sid, idx) {
  const s = findSubject(sid), a = s.assignments[idx], list = submissionList(sid, a.assignment_id);
  const roster = rosterFor(sid), sent = new Set(list.map(x => x.st.student_id)), missing = roster.filter(r => !sent.has(r.student_id));
  const rows = list.map(x => `<div class="row"><div><strong>${escapeHtml(x.st.full_name)}</strong> <span class="meta">เลขที่ ${escapeHtml(x.st.seat_no)} · ${x.sub.on_time ? 'ตรงเวลา' : '<span style="color:#B3261E;">ส่งช้า</span>'}</span></div>
      <div>${x.status === 'graded' ? `<span class="badge gold">${x.sub.total}/${x.sub.max_total}</span> <button class="btn outline sm" style="margin:0;" onclick="openGrade('${sid}',${idx},'${x.st.student_id}')">ดู/ตรวจใหม่</button>` : `<button class="btn red sm" style="margin:0;" onclick="openGrade('${sid}',${idx},'${x.st.student_id}')">ตรวจงาน</button>`}</div></div>`).join('') || '<p style="color:#999;">ยังไม่มีนักเรียนส่งงาน</p>';
  byId('subject-tab-body').innerHTML = `<button class="btn outline sm" style="margin-bottom:10px;" onclick="openSubjectDetail('${sid}','assignment')">‹ กลับหน้าชิ้นงาน</button>
    <div class="card"><h2>${escapeHtml(a.title)}</h2><div class="meta">ส่งแล้ว ${list.length}/${roster.length} คน · กำหนดส่ง ${a.due_at ? fmtThaiDate(a.due_at) : 'ไม่กำหนด'}</div>${rows}
    ${missing.length ? `<div class="meta" style="margin-top:10px;">ยังไม่ส่ง: ${missing.map(m => escapeHtml(m.full_name)).join(' · ')}</div>` : ''}</div>`;
}
async function openGrade(sid, idx, uid) {
  const s = findSubject(sid), a = s.assignments[idx], st = DEMO.roster.find(x => x.student_id === uid);
  const g = st.submissions.find(x => x.assignment_id === a.assignment_id && x.subject_id === sid), p = st.pending_subs.find(x => x.assignment_id === a.assignment_id && x.subject_id === sid), sub = g || p;
  byId('subject-tab-body').innerHTML = `<button class="btn outline sm" style="margin-bottom:10px;" onclick="openGradeList('${sid}',${idx})">‹ กลับรายชื่อที่ส่ง</button>
    <div class="card"><h2>${escapeHtml(a.title)}</h2><div class="meta"><strong style="color:var(--black);">${escapeHtml(st.full_name)}</strong> · ส่งเมื่อ ${fmtThaiDate(String(sub.submitted_at).slice(0, 10))} · ${sub.on_time ? 'ตรงเวลา' : 'ส่งช้า'}</div>
      ${sub.note ? `<div style="background:#F5EBD0;border-radius:10px;padding:8px;margin:8px 0;">💬 ${escapeHtml(sub.note)}</div>` : ''}
      <div id="gr_imgs" class="meta" style="margin:10px 0;">⏳ กำลังโหลดรูปผลงาน…</div></div>
    <div class="card"><h2>ให้คะแนน</h2>
      ${a.rubric.map((r, i) => `<div class="row"><div>${escapeHtml(r.name)} <span class="meta">(เต็ม ${r.max})</span></div><div><input type="number" min="0" max="${r.max}" step="0.5" inputmode="decimal" id="gr_${i}" style="width:84px;margin:0;" value="${g && g.result.criteria[i] ? g.result.criteria[i].score : ''}" oninput="gradeSum('${sid}',${idx})"></div></div>`).join('')}
      <div class="row"><div><strong>รวม</strong></div><div><strong id="gr_sum">0</strong> / ${asgMaxTotal(a)}</div></div>
      <label>ความเห็นถึงนักเรียน</label><textarea id="gr_comment" rows="3" placeholder="ชม จุดที่ควรพัฒนา">${g ? escapeHtml(g.comment || '') : ''}</textarea>
      <div id="gr_err" class="error-msg"></div>
      <button class="btn gold" id="gr_btn" onclick="saveGrade('${sid}',${idx},'${uid}')">${g ? 'บันทึกการตรวจใหม่' : 'บันทึกคะแนน'}</button></div>`;
  gradeSum(sid, idx);
  try {
    const r = await api('getSubmissionImages', { assignment_id: a.assignment_id, user_id: uid });
    byId('gr_imgs').innerHTML = r.images.map(im => im.src ? `<img src="${im.src}" style="width:100%;max-height:520px;object-fit:contain;background:#F7F2E6;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;display:block;">` : '').join('') || 'ไม่มีรูป';
  } catch (e) { if (byId('gr_imgs')) byId('gr_imgs').textContent = e.network ? 'ออฟไลน์ — โหลดรูปไม่ได้' : e.message; }
}
function gradeSum(sid, idx) { const a = asgOf(sid, idx); let t = 0; a.rubric.forEach((r, i) => { t += Math.max(0, Math.min(r.max, Number(byId('gr_' + i).value) || 0)); }); byId('gr_sum').textContent = Math.round(t * 10) / 10; }
async function saveGrade(sid, idx, uid) {
  const a = asgOf(sid, idx), err = byId('gr_err'), btn = byId('gr_btn'), scores = [];
  for (let i = 0; i < a.rubric.length; i++) {
    const raw = byId('gr_' + i).value; const v = Number(raw);
    if (raw === '' || isNaN(v) || v < 0 || v > a.rubric[i].max) { err.textContent = `ใส่คะแนนข้อ "${a.rubric[i].name}" ให้อยู่ระหว่าง 0–${a.rubric[i].max}`; return; }
    scores.push(v);
  }
  err.textContent = ''; btn.disabled = true;
  try {
    const r = await api('gradeSubmission', { assignment_id: a.assignment_id, user_id: uid, scores, comment: byId('gr_comment').value.trim() });
    await refreshFromServer(); toast('บันทึกคะแนนแล้ว · ทักษะ ' + (r.progress.skill != null ? '→ ' + r.progress.skill : '')); openGradeList(sid, findSubject(sid).assignments.findIndex(x => x.assignment_id === a.assignment_id));
  } catch (e) { err.textContent = e.network ? 'ออฟไลน์ — บันทึกคะแนนต้องออนไลน์' : e.message; btn.disabled = false; }
}

/* ---------------- นักเรียน: ส่งงาน ---------------- */
function renderStudentWorkList() {
  const st = DEMO.student, list = [];
  DEMO.subjects.forEach(s => s.assignments.forEach((a, i) => list.push({ s, a, i })));
  const rows = list.map(({ s, a, i }) => {
    const g = st.submissions.find(x => x.subject_id === s.subject_id && x.assignment_id === a.assignment_id), p = st.pending_subs.find(x => x.subject_id === s.subject_id && x.assignment_id === a.assignment_id);
    const late = a.due_at && new Date() > new Date(a.due_at + 'T23:59:59');
    return `<div class="row"><div><strong>${escapeHtml(a.title)}</strong><div class="meta">${escapeHtml(s.subject_name)} · กำหนดส่ง ${a.due_at ? fmtThaiDate(a.due_at) : 'ไม่กำหนด'}${late && !g && !p ? ' <span style="color:#B3261E;">เลยกำหนดแล้ว</span>' : ''}</div></div>
      <div>${g ? `<button class="btn outline sm" style="margin:0;" onclick="openMyWork('${s.subject_id}',${i})"><span class="badge gold">ตรวจแล้ว ${g.total}/${g.max_total}</span></button>`
        : p ? `<span class="badge">รอครูตรวจ</span> <button class="btn outline sm" style="margin:0;" onclick="openSubmitWork('${s.subject_id}',${i})">ส่งใหม่</button>`
        : `<button class="btn red sm" style="margin:0;" onclick="openSubmitWork('${s.subject_id}',${i})">ส่งงาน</button>`}</div></div>`;
  }).join('') || '<p style="color:#999;font-size:calc(13.5px * var(--fs));">ยังไม่มีหัวข้อชิ้นงานให้ส่ง</p>';
  byId('student-body').innerHTML = `<div class="card"><h2>ชิ้นงานปฏิบัติ</h2>${rows}</div>`;
}
let WORK_IMGS = [];
function openSubmitWork(sid, idx) {
  const a = asgOf(sid, idx); WORK_IMGS = [];
  byId('student-body').innerHTML = `<div class="card"><h2>${escapeHtml(a.title)}</h2>
      ${a.description ? `<p style="line-height:1.7;margin:4px 0;">${escapeHtml(a.description)}</p>` : ''}
      <p class="meta">เกณฑ์: ${a.rubric.map(r => escapeHtml(r.name) + ' (' + r.max + ')').join(' · ')}</p>
      <label>รูปผลงาน (ได้ 1–3 รูป)</label>
      <label for="work_file" class="btn outline" style="display:block;text-align:center;cursor:pointer;margin-top:4px;border:1.5px dashed var(--red);color:var(--red);padding:16px;font-weight:600;">📷 เลือกรูป / ถ่ายภาพผลงาน</label>
      <input type="file" id="work_file" accept="image/*" multiple onchange="addWorkFiles(this)">
      <div id="work_preview" style="margin-top:10px;"></div>
      <label>ข้อความถึงครู (ไม่บังคับ)</label><textarea id="work_note" rows="2" placeholder="เช่น ใช้สีฝุ่น ขนาด A4"></textarea>
      <div id="work_err" class="error-msg"></div>
      <button class="btn gold" id="work_btn" onclick="submitWork('${sid}',${idx})">ส่งงาน</button>
      <button class="btn outline" style="width:100%;margin-top:8px;" onclick="renderStudentWorkList()">ยกเลิก</button></div>`;
}
async function addWorkFiles(input) {
  const files = Array.from(input.files || []), err = byId('work_err'); err.textContent = '';
  for (const f of files.slice(0, Math.max(0, 3 - WORK_IMGS.length))) { try { WORK_IMGS.push(await readWorkImage(f)); } catch (e) { err.textContent = e.message; } }
  if (files.length > 3) err.textContent = 'ส่งได้สูงสุด 3 รูป'; input.value = '';
  byId('work_preview').innerHTML = WORK_IMGS.map((d, i) => `<div style="position:relative;margin-bottom:8px;"><img src="${d}" style="max-width:100%;max-height:300px;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto;"><button class="btn outline sm" style="position:absolute;top:6px;right:6px;margin:0;background:#fff;" onclick="WORK_IMGS.splice(${i},1);addWorkFiles({files:[]})">✕</button></div>`).join('');
}
async function submitWork(sid, idx) {
  const a = asgOf(sid, idx), err = byId('work_err'), btn = byId('work_btn');
  if (!WORK_IMGS.length) { err.textContent = 'เลือกรูปผลงานก่อน'; return; }
  btn.disabled = true; btn.textContent = 'กำลังส่ง…'; err.textContent = '';
  try {
    const r = await api('submitWork', { assignment_id: a.assignment_id, note: byId('work_note').value.trim(), images: WORK_IMGS.map(src => ({ src })) });
    const st = DEMO.student;
    st.pending_subs = st.pending_subs.filter(x => !(x.subject_id === sid && x.assignment_id === a.assignment_id));
    st.pending_subs.push({ subject_id: sid, assignment_index: idx, assignment_id: a.assignment_id, status: 'submitted', on_time: r.on_time, submitted_at: new Date().toISOString() });
    if (r.first) { st.ability.perseverance = r.progress.perseverance; st.ability.punctuality = r.progress.punctuality; }
    WORK_IMGS = [];
    byId('student-body').innerHTML = `<div class="card"><h2>ส่งงานแล้ว 🎉</h2><p style="line-height:1.7;">ครูจะตรวจให้คะแนนเร็ว ๆ นี้ ระหว่างนี้ส่งใหม่ทับได้จนกว่าครูจะตรวจ</p>
      <p class="meta">${r.first ? 'ความเพียร +' + r.gains.perseverance + (r.on_time ? ' · ตรงต่อเวลา +' + r.gains.punctuality : ' · (ส่งช้ากว่ากำหนด)') : 'ส่งงานใหม่แทนชิ้นเดิมแล้ว (ไม่ได้คะแนนเพิ่มซ้ำ)'}</p>
      <button class="btn gold" style="width:100%;" onclick="renderStudentWorkList()">กลับไปหน้ารายการชิ้นงาน</button></div>`;
  } catch (e) { err.textContent = e.network ? 'ส่งไม่สำเร็จ — ออฟไลน์ ต่อสัญญาณแล้วกดส่งอีกครั้ง (รูปยังอยู่ในหน้านี้)' : e.message; btn.disabled = false; btn.textContent = 'ส่งงาน'; }
}
function openMyWork(sid, idx) {
  const a = asgOf(sid, idx), g = DEMO.student.submissions.find(x => x.subject_id === sid && x.assignment_id === a.assignment_id);
  byId('student-body').innerHTML = `<div class="card"><h2>${escapeHtml(a.title)}</h2>
    <p style="font-size:calc(26px * var(--fs));font-weight:700;color:var(--red);text-align:center;margin:8px 0;">${g.total} / ${g.max_total}</p>
    ${g.result.criteria.map(c => `<div class="row"><div>${escapeHtml(c.name)}</div><div><strong>${c.score}</strong></div></div>`).join('')}
    ${g.comment ? `<div style="background:#F5EBD0;border-radius:10px;padding:10px;margin-top:10px;line-height:1.7;">💬 ${escapeHtml(g.comment)}</div>` : ''}
    <p class="meta" style="margin-top:8px;">ทักษะฝีมือ +${Math.round(g.total / g.max_total * GAIN.skillMax)} · ${g.on_time ? 'ส่งตรงเวลา' : 'ส่งช้ากว่ากำหนด'}</p>
    <div id="my_imgs" class="meta">⏳ กำลังโหลดรูป…</div>
    <button class="btn gold" style="width:100%;" onclick="renderStudentWorkList()">กลับไปหน้ารายการชิ้นงาน</button></div>`;
  api('getSubmissionImages', { assignment_id: a.assignment_id }).then(r => { if (byId('my_imgs')) byId('my_imgs').innerHTML = r.images.map(im => im.src ? `<img src="${im.src}" style="width:100%;max-height:420px;object-fit:contain;background:#F7F2E6;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;display:block;">` : '').join(''); }).catch(() => { if (byId('my_imgs')) byId('my_imgs').textContent = ''; });
}

startApp();

</script>
</body>
</html>
