  :root {
    --red: #8B2635; --red-dark: #5C1A23; --gold: #D4A017; --gold-light: #F0D878;
    --fs: 1.2; --hd: 'ThamPhisut','Sarabun','TH SarabunPSK',sans-serif; --white: #FDFBF7; --black: #1C1C1C; --sea: #1B5E7A; --sea-light: #E3F0F5; --line: #E8DFD0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-size: calc(16px * var(--fs)); font-family: 'TH SarabunPSK','TH Sarabun New','Sarabun','Segoe UI',sans-serif; background: var(--white); color: var(--black);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .preview-banner { background: var(--gold); color: var(--black); text-align: center; font-size:calc(12.5px * var(--fs)); padding: 6px 10px; font-weight: 600; }
  .topbar { background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%); color: var(--gold-light); padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); top: env(safe-area-inset-top, 0px); }
  .topbar h1 { font-size:calc(25px * var(--fs)); margin: 0; color: var(--gold-light); }
  .topbar p { font-size:calc(16px * var(--fs)); margin: 2px 0 0; color: var(--white); opacity: .85; }
  .topbar button { background: transparent; border: 1px solid var(--gold); color: var(--gold-light); border-radius: 8px; padding: 6px 14px; font-family: inherit; cursor: pointer; }
  .tabs { display: flex; gap: 2px; background: var(--black); padding: 0 10px; overflow-x: auto; }
  .tabs button { background: none; border: none; color: #ccc; padding: 11px 14px; font-family: inherit; font-size:calc(16.5px * var(--fs)); cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
  .tabs button.active { color: var(--gold-light); border-bottom-color: var(--gold); font-weight: 600; }
  .sh-row { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .sh-photo { order: 1; }
  .sh-info { order: 2; flex: 1 1 150px; min-width: 0; align-self: center; }
  .sh-badge { order: 3; flex: 0 0 auto; margin-left: auto; align-self: center; }
  .sh-radar { order: 4; flex: 2 1 260px; min-width: 240px; display: flex; align-items: center; justify-content: center; }
  @media (min-width: 760px) { .sh-badge { order: 5; margin-left: 0; } }
  .rpt-table { border-collapse: collapse; width: 100%; font-size: calc(13px * var(--fs)); }
  .rpt-table th, .rpt-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; vertical-align: middle; }
  .rpt-table th { background: #F5EBD0; font-weight: 600; }
  .rpt-table td:first-child { text-align: left; }
  .syncbar { position: fixed; left: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 998; max-width: calc(100vw - 190px); background: #D4A82A; color: #1a1a1a; font-size: calc(13px * var(--fs)); font-weight: 600; line-height: 1.4; padding: 8px 14px; border-radius: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.25); pointer-events: none; }
  .syncbar[hidden] { display: none; }
  .syncbar.off { background: #3b3b3b; color: #F5E6B8; }
  .toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: #2b2b2b; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: calc(14px * var(--fs)); opacity: 0; pointer-events: none; transition: all .25s; z-index: 1000; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.bad { background: #8A1C1C; }
  #printarea { display: none; }
  .pcards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .pcard { border: 1.5px dashed #555; border-radius: 8px; padding: 10px; line-height: 1.6; page-break-inside: avoid; font-size: 13px; }
  @media print { body.printing #app, body.printing #zoombar, body.printing .footer-note, body.printing #syncbar { display: none !important; } body.printing #printarea { display: block; } }
  #zoombar { position: fixed; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 999; display: flex; align-items: center; gap: 2px;
    background: rgba(28,28,28,.88); border-radius: 999px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.28); -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #zoombar button { font-family: inherit; border: none; background: none; color: #F5E6B8; cursor: pointer; border-radius: 999px; min-width: 42px; height: 42px; font-size: 22px; line-height: 1; padding: 0 6px; }
  #zoombar button:active { background: rgba(255,255,255,.18); }
  #zoombar #zoom_pct { font-size: 14px; font-weight: 700; min-width: 56px; }
  .container { max-width: 760px; margin: 0 auto; padding: 18px; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card h2 { font-size:calc(20px * var(--fs)); margin: 0 0 12px; color: var(--red); border-left: 4px solid var(--gold); padding-left: 9px; }
  label { display: block; font-size:calc(12.5px * var(--fs)); color: #555; margin-bottom: 4px; margin-top: 9px; }
  input, select, textarea { width: 100%; font-family: inherit; font-size:calc(15px * var(--fs)); padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
  input[type=radio], input[type=checkbox] { width: 22px; height: 22px; padding: 0; flex-shrink: 0; accent-color: var(--red); }
  input[type=date] { box-sizing: border-box; max-width: 100%; min-height: 42px; text-align: left; -webkit-appearance: none; appearance: none; }
  input[type=file] { display: none; }

<body>

<div id="syncbar" class="syncbar" hidden></div>
<div id="app"><div class="loading">กำลังโหลด...</div></div>
<div id="zoombar" aria-label="ซูมเข้า-ออก">
  <button type="button" onclick="zoomBy(-0.1)" aria-label="ซูมออก">−</button>
  <button type="button" id="zoom_pct" onclick="zoomSet(1)" title="กลับเป็น 100%">100%</button>
  <button type="button" onclick="zoomBy(0.1)" aria-label="ซูมเข้า">+</button>
</div>

<script>
// ============================== STATE ==============================
let CURRENT_USER = null;
let SAMPLE = null;        // namespace จาก claude.use("sample")
let SAMPLE_LIMITS = null; // ผลจาก sample.limits()
let CURRENT_SUBJECT_ID = null;
let EXAM_RUNNER = null;   // state ระหว่างทำข้อสอบ

const ABILITY_KEYS = ['intelligence','speed','skill','perseverance','creativity','punctuality'];
const ABILITY_LABELS = { intelligence:'ปัญญา', speed:'ความเร็ว', skill:'ทักษะฝีมือ', perseverance:'ความเพียร', creativity:'สร้างสรรค์', punctuality:'ตรงต่อเวลา' };
const ABILITY_SHORT = { intelligence:'ปัญญา', speed:'เร็ว', skill:'ฝีมือ', perseverance:'เพียร', creativity:'สร้างสรรค์', punctuality:'ตรงเวลา' };
const ABILITY_COLORS = {
  intelligence: { bg:'#E3F0F5', text:'#1B5E7A' },
  speed:        { bg:'#FBF0D2', text:'#8A6A08' },
  skill:        { bg:'#F6E3E6', text:'#8B2635' },
  perseverance: { bg:'#E6F3EA', text:'#1F6B3F' },
  creativity:   { bg:'#EFE7F6', text:'#5B3A8A' },
  punctuality:  { bg:'#ECECEC', text:'#333333' },
};

function makeStudent(id, username, full_name, nickname, room, seat_no, ability, rank_level, rank_points) {
  return { student_id:id, username, full_name, nickname, photo:'', level:'ปวช.', room, seat_no, birthdate:'2009-03-14',
    ability: Object.fromEntries(Object.entries(ability).map(([k, v]) => [k, Math.min(100, Math.round(v * 100 / 30))])), rank_level, rank_points, exam_attempts:[], submissions:[] };
}

const DEMO = { subjects: [], teacher: { prefix: 'นาย', full_name: '', nickname: '', position: 'ครู', department: '', institution: '', birthdate: '', phone: '', photo: '' }, attendance: [], roster: [], student: null };

const ABILITY_MAX = 100;                       // คะแนนความสามารถเต็ม 100
const ABILITY_PER_LEVEL = ABILITY_MAX / 10;    // 10 คะแนนต่อ 1 ระดับ (ระดับ 10 = 90 ขึ้นไป)
// คะแนนความสามารถที่ได้จากกิจกรรม (สเกลเต็ม 100)
const GAIN = { perCorrect: 3, speedFast: 7, skillMax: 30, perseverance: 7, punctuality: 10 };
function addAbility(key, v) { const a = DEMO.student.ability; a[key] = Math.min(ABILITY_MAX, Math.round(((Number(a[key]) || 0) + v) * 10) / 10); }
function abilityRank(val) {
  const level = Math.max(1, Math.min(10, Math.floor(val / ABILITY_PER_LEVEL) + 1));
  const toNext = level >= 10 ? 0 : ABILITY_PER_LEVEL - (val % ABILITY_PER_LEVEL);
  return { level, name: RANK_NAMES[level - 1], toNext };
}
function abilityBlocksFull(ability) {
  return '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">' +
    ABILITY_KEYS.map(k => { const c = ABILITY_COLORS[k], rk = abilityRank(ability[k]);
      return `<div style="background:${c.bg};border:1.5px solid ${c.text}33;border-radius:12px;padding:12px 6px;text-align:center;">
        <div class="hd" style="font-size:calc(15px * var(--fs));color:${c.text};">${ABILITY_LABELS[k]}</div>
        <div class="hd" style="font-size:calc(30px * var(--fs));color:${c.text};line-height:1.2;">${Math.round(ability[k])}</div>
        <div class="hi" style="font-size:calc(13px * var(--fs));color:${c.text};opacity:.95;">ขั้น ${rk.level} · ${rk.name}</div>
      </div>`; }).join('') + '</div>';
}
function abilityRankChart(ability) {
  return ABILITY_KEYS.map(k => {
    const c = ABILITY_COLORS[k], rk = abilityRank(ability[k]);
    const segs = Array.from({ length: 10 }, (_, i) => `<div style="flex:1;height:16px;border-radius:5px;background:${i < rk.level ? c.text : c.bg};${i < rk.level ? '' : 'border:1px solid ' + c.text + '33;'}"></div>`).join('');
    return `<div style="margin:14px 0;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
        <span class="hd" style="font-size:calc(17px * var(--fs));color:${c.text};">${ABILITY_LABELS[k]}</span>
        <span class="hi" style="font-size:calc(15px * var(--fs));color:${c.text};">ขั้น ${rk.level}/10 · ${rk.name}</span>
      </div>
      <div style="display:flex;gap:3px;margin-top:5px;">${segs}</div>
      <div class="meta" style="margin-top:3px;">${rk.toNext ? `อีก ${rk.toNext.toFixed(rk.toNext % 1 ? 1 : 0)} คะแนน ถึงขั้น ${RANK_NAMES[rk.level]}` : 'ถึงขั้นสูงสุดแล้ว'}</div>
    </div>`;
  }).join('');
}
function abilityBlocksCompact(ability) {
  return '<div style="display:flex;gap:4px;flex-wrap:wrap;">' +
    ABILITY_KEYS.map(k => { const c = ABILITY_COLORS[k];
      return `<div style="background:${c.bg};color:${c.text};border-radius:7px;padding:3px 8px;font-size:calc(10.5px * var(--fs));font-weight:600;white-space:nowrap;">${ABILITY_SHORT[k]} ${Math.round(ability[k])}</div>`; }).join('') + '</div>';
}
function avatarCircle(name, size) {
  size = size || 40;
  const initial = (name || '?').charAt(0);
  const ph = arguments[2];
  if (ph) return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:url('${ph}') center/cover;flex-shrink:0;"></div>`;
  return `<div class="hd" style="width:${size}px;height:${size}px;border-radius:50%;background:var(--gold-light);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--red);flex-shrink:0;font-size:${Math.round(size*0.42)}px;">${escapeHtml(initial)}</div>`;
}

function radarSvg(ability, size) {
  size = size || 240;
  const W = size * 1.45, H = size * 1.12;
  const cx = W / 2, cy = H / 2 + 2, r = size * 0.33, maxVal = 100;
  const ang = i => (-90 + i * 60) * Math.PI / 180;
  const P = (i, val) => { const rr = Math.min(val, maxVal) / maxVal * r; return [cx + rr * Math.cos(ang(i)), cy + rr * Math.sin(ang(i))]; };
  const fmt = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  const grids = [0.2, 0.4, 0.6, 0.8, 1].map(lv => `<polygon points="${ABILITY_KEYS.map((_, i) => fmt([cx + lv * r * Math.cos(ang(i)), cy + lv * r * Math.sin(ang(i))])).join(' ')}" fill="none" stroke="#E2D8C6" stroke-width="1"/>`).join('');
  const sectors = ABILITY_KEYS.map((k, i) => {
    const j = (i + 1) % 6, c = ABILITY_COLORS[k], cj = ABILITY_COLORS[ABILITY_KEYS[j]];
    return `<polygon points="${fmt([cx, cy])} ${fmt(P(i, ability[k]))} ${fmt(P(j, ability[ABILITY_KEYS[j]]))}" fill="${c.text}" fill-opacity="0.38"/>`;
  }).join('');
  const outline = `<polygon points="${ABILITY_KEYS.map((k, i) => fmt(P(i, ability[k]))).join(' ')}" fill="none" stroke="#5C1A23" stroke-width="2" stroke-linejoin="round"/>`;
  const fn = size * 0.056, fr = size * 0.046;
  const axes = ABILITY_KEYS.map((k, i) => {
    const c = ABILITY_COLORS[k], rk = abilityRank(ability[k]);
    const [x, y] = P(i, maxVal), [vx, vy] = P(i, ability[k]);
    const lx = cx + r * 1.2 * Math.cos(ang(i)), ly = cy + r * 1.2 * Math.sin(ang(i));
    const anchor = Math.abs(Math.cos(ang(i))) < 0.1 ? 'middle' : (Math.cos(ang(i)) > 0 ? 'start' : 'end');
    const dx = anchor === 'start' ? -r * 0.06 : anchor === 'end' ? r * 0.06 : 0;
    const dy = i === 0 ? -fn * 0.9 : i === 3 ? fn * 0.6 : 0;
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${c.text}" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="${vx.toFixed(1)}" cy="${vy.toFixed(1)}" r="${size * 0.018}" fill="${c.text}" stroke="#fff" stroke-width="1.2"/>
      <text x="${(lx + dx).toFixed(1)}" y="${(ly + dy - fr * 0.45).toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" style="font-family:'ThamPhisut','Sarabun',sans-serif;font-size:${fn * 1.25}px;fill:${c.text};">${ABILITY_SHORT[k]} ${Math.round(ability[k])}</text>
      <text x="${(lx + dx).toFixed(1)}" y="${(ly + dy + fn * 0.75).toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" style="font-family:'ThamPhisut','Sarabun',sans-serif;font-style:italic;font-size:${fr * 1.3}px;fill:${c.text};">${rk.name}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" style="width:100%;max-width:${W.toFixed(0)}px;height:auto;display:block;">${grids}${sectors}${outline}${axes}</svg>`;
}

// ============================== วันที่ พ.ศ. + ปฏิทิน ==============================
const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MON_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_WD = ['อา','จ','อ','พ','พฤ','ศ','ส'];
function pad2(n) { return String(n).padStart(2, '0'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function fmtThaiDate(iso) {
  if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return 'ยังไม่ระบุ';
  const [y, m, d] = iso.split('-').map(Number);
  return d + ' ' + TH_MON_SHORT[m - 1] + ' พ.ศ. ' + (y + 543);
}
const CAL = {};
function dateField(id, iso, cbName) {
  CAL[id] = { cb: cbName || '', y: 0, m: 0 };
  return `<div style="position:relative;">
    <input type="hidden" id="${id}" value="${escapeHtml(iso || '')}">
    <button type="button" class="datebtn" id="${id}_btn" onclick="toggleCal('${id}')"><span id="${id}_txt">${fmtThaiDate(iso)}</span><span>📅</span></button>
    <div class="calpop hidden" id="${id}_pop"></div>
  </div>`;
}
function toggleCal(id) {
  const pop = byId(id + '_pop');
  if (!pop.classList.contains('hidden')) { pop.classList.add('hidden'); return; }
  const v = byId(id).value || todayISO();
  const [y, m] = v.split('-').map(Number);
  CAL[id].y = y; CAL[id].m = m - 1;
  renderCal(id);
  pop.classList.remove('hidden');
}
function renderCal(id) {
  const c = CAL[id], cur = byId(id).value, today = todayISO();
  const nowY = new Date().getFullYear();
  let yOpts = '';
  for (let y = nowY + 2; y >= nowY - 80; y--) yOpts += `<option value="${y}" ${y === c.y ? 'selected' : ''}>${y + 543}</option>`;
  const mOpts = TH_MONTHS.map((n, i) => `<option value="${i}" ${i === c.m ? 'selected' : ''}>${n}</option>`).join('');
  const first = new Date(c.y, c.m, 1).getDay(), days = new Date(c.y, c.m + 1, 0).getDate();
  let cells = TH_WD.map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < first; i++) cells += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const iso = c.y + '-' + pad2(c.m + 1) + '-' + pad2(d);
    cells += `<button type="button" class="${iso === cur ? 'sel' : ''} ${iso === today ? 'today' : ''}" onclick="pickCalDate('${id}','${iso}')">${d}</button>`;
  }
  byId(id + '_pop').innerHTML = `
    <div style="display:flex;gap:6px;align-items:center;justify-content:space-between;">
      <button type="button" class="calnav" onclick="calNav('${id}',-1)">‹</button>
      <div style="display:flex;gap:4px;">
        <select onchange="calSet('${id}','m',this.value)">${mOpts}</select>
        <select onchange="calSet('${id}','y',this.value)">${yOpts}</select>
      </div>
      <button type="button" class="calnav" onclick="calNav('${id}',1)">›</button>
    </div>
    <div class="calgrid">${cells}</div>
    <div style="text-align:center;margin-top:8px;"><button type="button" class="btn outline sm" onclick="pickCalDate('${id}','${today}')">วันนี้</button></div>`;
}
function calNav(id, delta) {
  const c = CAL[id]; c.m += delta;
  if (c.m < 0) { c.m = 11; c.y--; } else if (c.m > 11) { c.m = 0; c.y++; }
  renderCal(id);
}
function calSet(id, k, v) { CAL[id][k] = Number(v); renderCal(id); }
function pickCalDate(id, iso) {
  byId(id).value = iso;
  byId(id + '_txt').textContent = fmtThaiDate(iso);
  byId(id + '_pop').classList.add('hidden');
  if (CAL[id].cb && typeof window[CAL[id].cb] === 'function') window[CAL[id].cb]();
}

// ============================== HELPERS ==============================
function render(html) { document.getElementById('app').innerHTML = html; }
function escapeHtml(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function byId(id) { return document.getElementById(id); }
function findSubject(id) { return DEMO.subjects.find(s => s.subject_id === id); }

async function ensureSample() {
  if (SAMPLE !== null) return SAMPLE;
  try {
    SAMPLE = await claude.use('sample');
    if (SAMPLE) { try { SAMPLE_LIMITS = await SAMPLE.limits(); } catch(e) {} }
  } catch (e) { SAMPLE = null; }
  return SAMPLE;
}
ensureSample();

function aiErrorMessage(e) {
  const map = {
    not_granted: 'ต้องอนุญาตให้ใช้ AI ก่อน (กดปุ่มอีกครั้งแล้วเลือกอนุญาต)',
    rate_limited: 'ใช้งานถี่เกินไป รอสักครู่แล้วลองใหม่',
    images_unavailable: 'มุมมองนี้ส่งรูปภาพให้ AI ไม่ได้',
    refused: 'AI ปฏิเสธคำขอนี้ ลองปรับคำอธิบายแล้วลองใหม่',
    invalid_json: 'AI ตอบกลับไม่อยู่ในรูปแบบที่ใช้ได้ ลองใหม่อีกครั้ง',
  };
  return map[e && e.code] || ('เกิดข้อผิดพลาด: ' + (e && e.message || 'ไม่ทราบสาเหตุ'));
}

// ============================== หน้าเลือกบทบาท ==============================
function showRolePicker() {
  render(`
    <div class="topbar"><div><h1>บุพสิกขา สิปปานุรักษ์</h1><p>สำนักช่างเขียนจิตรกรรมไทยแบบประเพณี</p></div></div>
    <div class="role-pick">
      <div class="card" onclick="enterStudent()"><h2 style="border:none;padding:0;">เข้าสำนัก (นักเรียนตัวอย่าง)</h2><p style="margin:0;color:#777;font-size:calc(13px * var(--fs));">ดูข้อสอบ ชิ้นงาน กราฟความสามารถ</p></div>
      <div class="card" onclick="enterTeacher()"><h2 style="border:none;padding:0;">ครูผู้สอน</h2><p style="margin:0;color:#777;font-size:calc(13px * var(--fs));">จัดการรายวิชา ข้อสอบ คลังความรู้ ชิ้นงาน</p></div>
    </div>
  `);
}
function enterStudent() { CURRENT_USER = { role:'student' }; showStudentDashboard(); }
function enterTeacher() { CURRENT_USER = { role:'teacher' }; showTeacherDashboard(); }
function logout() { CURRENT_USER = null; CURRENT_SUBJECT_ID = null; showRolePicker(); }

// ============================== แดชบอร์ดครู ==============================
function showTeacherDashboard() {
  render(`
    <div class="topbar"><div style="display:flex;align-items:center;gap:10px;">${DEMO.teacher.photo ? avatarCircle(DEMO.teacher.full_name, 42, DEMO.teacher.photo) : ''}<div><h1>ครูผู้สอน</h1><p>${escapeHtml(DEMO.teacher.full_name)}</p></div></div><button onclick="logout()">ออก</button></div>
    <div class="tabs">
      <button class="active" data-tt="subjects" onclick="switchTeacherTab('subjects')">รายวิชา</button>
      <button data-tt="roster" onclick="switchTeacherTab('roster')">ศิษย์ในสำนัก</button>

function switchTeacherTab(tab) {

function badgeFrond(p0, c, p1, n, maxLen, leafW, T, fillId) {
  let out = '';
  const bez = t => ({ x: (1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * c[0] + t * t * p1[0], y: (1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * c[1] + t * t * p1[1] });

    const t = i / (n + 1), q = bez(t), th = tan(t), L = maxLen * Math.sin(Math.PI * (0.2 + 0.8 * t));

      const cx = q.x + Math.cos(a) * L / 2, cy = q.y + Math.sin(a) * L / 2;

    });
  }

}

    g += badgeFrond([sd * 5, -6], [sd * 28, -3], [sd * 50, -11], 12, 10, 1.9, T, fillId);        // ใบแนวนอนรองด้านล่าง
  });

  const pal = () => { const cols = ['#B83227', '#E0A91C', '#4C7A3A', '#2E4B8F', '#F2EEE3', '#2B2B2B']; let d = '';
    cols.forEach((c, i) => { const a = (-90 + i * 60) * Math.PI / 180; d += `<circle cx="${(15.5 * Math.cos(a)).toFixed(1)}" cy="${(15.5 * Math.sin(a)).toFixed(1)}" r="5.4" fill="${c}" ${st}/>`; });
    return `<circle r="26" fill="${u('wood')}" ${st}/><circle r="22.5" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width=".8"/>${d}<circle r="5.2" fill="#F8F2E4" ${st}/>`; };
  const bowl = `<path d="M-17 -4 L17 -4 Q16 12 0 13.5 Q-16 12 -17 -4 Z" fill="${u('silver')}" ${st}/><ellipse cx="0" cy="-4" rx="17" ry="4.6" fill="#7FB8E0" ${st}/><ellipse cx="-4" cy="-4.6" rx="7" ry="1.3" fill="#fff" opacity=".5"/>`;
  const drop = (x, y, k) => `<path transform="translate(${x} ${y}) scale(${k})" d="M0 -5 C3 -1 4 1.6 0 4.4 C-4 1.6 -3 -1 0 -5 Z" fill="#7FB8E0" ${st}/>`;
  const cup = `<path d="M-7 -4 H7 L5.6 6 Q0 8.4 -5.6 6 Z" fill="${u('cer')}" ${st}/><ellipse cx="0" cy="-4" rx="7" ry="2.2" fill="#E0A91C" ${st}/>`;
  const mural = `<path d="M-17 20 V-7 Q-17 -22 0 -22 Q17 -22 17 -7 V20 Z" fill="#EADFC8" ${st}/><path d="M-13 17 V-6 Q-13 -18 0 -18 Q13 -18 13 -6 V17 Z" fill="none" stroke="${D}" stroke-width=".5" stroke-dasharray="1.6 1.4"/><path d="M-8 12 C-9 4 2 5 0 -2 C-2 -8 6 -8 5 -13" fill="none" stroke="#B83227" stroke-width="1.6" stroke-linecap="round"/><path d="M-6 8 C-3 6 -1 3 -2 0" fill="none" stroke="#4C7A3A" stroke-width="1.4" stroke-linecap="round"/><path d="M3 12 C9 8 9 2 6 -2" fill="none" stroke="#2E4B8F" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 1.6"/>`;
  const trowel = `<polygon points="0,17 -8,3 8,3" fill="${u('steel')}" ${st}/><rect x="-1.5" y="-14" width="3" height="17" rx="1.2" fill="${u('wood')}" ${st}/>`;
  const plumb = `<line x1="0" y1="-20" x2="0" y2="8" stroke="${D}" stroke-width=".7"/><polygon points="0,19 -3.8,8 3.8,8" fill="${u('steel')}" ${st}/><circle cx="0" cy="-20" r="1.3" fill="${D}"/>`;
  const compass = `<line x1="0" y1="-21" x2="-10" y2="22" stroke="${D}" stroke-width="4.2" stroke-linecap="round"/><line x1="0" y1="-21" x2="-10" y2="22" stroke="${u('steel')}" stroke-width="2.6" stroke-linecap="round"/><line x1="0" y1="-21" x2="10" y2="22" stroke="${D}" stroke-width="4.2" stroke-linecap="round"/><line x1="0" y1="-21" x2="10" y2="22" stroke="${u('gold')}" stroke-width="2.6" stroke-linecap="round"/><circle cx="0" cy="-21" r="3.6" fill="${u('gold')}" ${st}/><polygon points="-11.2,22 -8.8,22 -10,27" fill="${D}"/><polygon points="8.8,22 11.2,22 10,26.5" fill="#2B2B2B"/>`;
  const ruler = (() => { let t = ''; for (let i = 0; i <= 12; i++) t += `<line x1="-5" y1="${-24 + i * 4}" x2="${i % 2 ? -2.8 : -.8}" y2="${-24 + i * 4}" stroke="${D}" stroke-width=".6"/>`; return `<rect x="-5" y="-26" width="10" height="52" rx="1" fill="${u('gold')}" ${st}/>${t}`; })();
  const book = (() => { let pg = ''; for (let i = 0; i < 5; i++) { const x = -22 + i * 9, y1 = i % 2 ? -4 : -7, y2 = i % 2 ? 7 : 4; pg += `<polygon points="${x},${y1} ${x + 9},${i % 2 ? -7 : -4} ${x + 9},${i % 2 ? 4 : 7} ${x},${y2}" fill="${i % 2 ? '#E3D2A8' : '#F6ECD2'}" ${st}/>`; }
    return pg + `<rect x="-23" y="-7" width="2.4" height="14" fill="#5A3A1E"/><rect x="21" y="-7" width="2.4" height="14" fill="#5A3A1E"/><path d="M-12 0 q3 -3 6 0 t6 0" fill="none" stroke="#B83227" stroke-width="1"/>`; })();
  const crossPair = (x, y, r, k, o) => at(x, y, r, k, brush(o)) + at(x, y, -r, k, brush(o));
  let g = '';
  const penPair = body => at(55, 46, 34, 1.4, pencil(body)) + at(55, 46, -34, 1.4, pencil(body));
  const fine = o => at(55, 46, 33, 1.22, brush(o)) + at(55, 46, -33, 1.22, brush(o));
  const trio = (o, fo) => fine(o) + at(55, 47, 0, 1.2, flatBr(fo));
  switch (level) {
    case 1: g = budF; break;                                            // ดอกบัวตูมลอยเดี่ยว
    case 2: g = penPair('#E7B93A'); break;                                                    // ดินสอไขว้ ด้ามเหลือง
    case 3: g = penPair('#C0392B'); break;                                                    // ด้ามแดง
    case 4: g = penPair('#2B2B2B'); break;                                                    // ด้ามดำ
    case 5: g = fine({ handle: u('wood') }); break;                                           // พู่กันตัดเส้นไขว้ ด้ามไม้
    case 6: g = fine({ handle: u('ivory') }); break;                                          // ด้ามงา
    case 7: g = fine({ handle: u('copper'), ferrule: u('copper') }); break;                   // ด้ามทองแดง
    case 8: g = trio({ handle: u('redlac'), ferrule: u('gold'), ring: true }, { handle: u('redlac'), ferrule: u('gold'), ring: true }); break;   // ด้ามทอง-แดง + พู่กันแปรง
    case 9: g = trio({ handle: u('silver'), ferrule: u('silver') }, { handle: u('silver'), ferrule: u('silver') }); break;                       // ด้ามเงิน
    default: g = trio({ handle: u('gold'), ferrule: u('gold'), tip: '#C99A1C' }, { handle: u('gold'), ferrule: u('gold') }) + sparkle(80, 18, 5, '#FFF6CC') + sparkle(30, 24, 4, '#FFF6CC');
  }
  return g;
}

// ---------- บัว 3 เหล่า (ผืนวาด 110 × 100 วงกลมกลาง 55,50 รัศมี 47) ----------
function lotusInner(level, id) {
  const gi = lotusGroup(level), yw = [38, 52, 70][gi];
  const P = { 1: [16, 3, 0, 84], 2: [20, 5, .04, 78], 3: [25, 5, .1, 72], 4: [22, 5, .12, 76], 5: [26, 5, .25, 76], 6: [31, 5, .42, 76], 7: [32, 5, .55, 78], 8: [36, 7, .7, 78], 9: [40, 9, .85, 78], 10: [44, 11, 1, 78] }[level];
  const h = P[0], n = P[1], open = P[2], by = P[3];
  const sky = [['#9FBFC6', '#D4E6E3'], ['#F2C9A0', '#FBE8C8'], ['#FFD777', '#FFF6D8']][gi];
  const defs = `<defs>
    <clipPath id="${id}c"><circle cx="55" cy="50" r="47"/></clipPath>
    <linearGradient id="${id}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>
    <linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FC8CC" stop-opacity="${gi === 0 ? .4 : .62}"/><stop offset="1" stop-color="#1F6A74" stop-opacity="${gi === 0 ? .66 : .9}"/></linearGradient>
    <linearGradient id="${id}p1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FBD5E2"/><stop offset="1" stop-color="#E0558A"/></linearGradient>
    <linearGradient id="${id}p2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FDE3EA"/><stop offset="1" stop-color="#EE7FA6"/></linearGradient>
    <linearGradient id="${id}p3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFF0F4"/><stop offset="1" stop-color="#F7B4CB"/></linearGradient>
    <radialGradient id="${id}glow"><stop offset="0" stop-color="#FFE9A0" stop-opacity=".95"/><stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/></radialGradient>
  </defs>`;
  const sparkle = (x, y, r) => `<path d="M${x} ${y - r} L${x + r * .28} ${y - r * .28} L${x + r} ${y} L${x + r * .28} ${y + r * .28} L${x} ${y + r} L${x - r * .28} ${y + r * .28} L${x - r} ${y} L${x - r * .28} ${y - r * .28} Z" fill="#FFF6CC" stroke="#B8860B" stroke-width=".4"/>`;
  // ดอก/ตูมบัว
  let petals = '';
  const A = 8 + open * 72, items = [];
  for (let i = 0; i < n; i++) { const t = n > 1 ? (i / (n - 1) - .5) * 2 : 0; items.push({ t, a: t * A }); }
  items.sort((x, y) => Math.abs(y.t) - Math.abs(x.t));
  items.forEach(it => {
    const at = Math.abs(it.t), len = h * (1 - .2 * at), w = len * .34 * (1 + .25 * (1 - at));
    const fill = at < .34 ? `url(#${id}p1)` : at < .72 ? `url(#${id}p2)` : `url(#${id}p3)`;
    petals += `<path transform="rotate(${it.a.toFixed(1)})" d="M0 0 C${(-w).toFixed(1)} ${(-len * .25).toFixed(1)} ${(-w * .8).toFixed(1)} ${(-len * .78).toFixed(1)} 0 ${(-len).toFixed(1)} C${(w * .8).toFixed(1)} ${(-len * .78).toFixed(1)} ${w.toFixed(1)} ${(-len * .25).toFixed(1)} 0 0 Z" fill="${fill}" stroke="#B83A63" stroke-width=".5" stroke-linejoin="round"/>`;
  });
  let stamens = '';
  if (level === 10) for (let i = -2; i <= 2; i++) stamens += `<circle cx="${i * 2.6}" cy="${-7 - Math.abs(i) * .6}" r="1.5" fill="#E8B923" stroke="#8A6410" stroke-width=".3"/>`;
  const flower = `<g transform="translate(55 ${by})">${petals}${stamens}</g>`;
  const stem = `<path d="M55 ${by} C49 ${by + 9} 61 ${by + 18} 55 110" fill="none" stroke="#2F6B3A" stroke-width="2.6" stroke-linecap="round"/>`;
  const sun = level >= 7 ? `<circle cx="55" cy="${by - h * .55}" r="${20 + (level - 7) * 3}" fill="url(#${id}glow)"/>` : level >= 5 ? `<circle cx="55" cy="${yw - 6}" r="13" fill="url(#${id}glow)" opacity=".55"/>` : '';
  const water = `<path d="M-2 ${yw} Q13 ${yw - 2.2} 27 ${yw} T55 ${yw} T83 ${yw} T112 ${yw} V110 H-2 Z" fill="url(#${id}w)"/><path d="M-2 ${yw} Q13 ${yw - 2.2} 27 ${yw} T55 ${yw} T83 ${yw} T112 ${yw}" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1"/>`;
  const pads = level >= 4 ? `<ellipse cx="21" cy="${yw + 6}" rx="${level >= 7 ? 15 : 12}" ry="${level >= 7 ? 4.6 : 3.8}" fill="#3E8B4F" stroke="#255F34" stroke-width=".7"/><ellipse cx="90" cy="${yw + 8}" rx="${level >= 7 ? 13 : 10}" ry="${level >= 7 ? 4 : 3.3}" fill="#3E8B4F" stroke="#255F34" stroke-width=".7"/><ellipse cx="18" cy="${yw + 5}" rx="5" ry="1.2" fill="#fff" opacity=".25"/>` : '';
  const ripples = level >= 4 ? `<ellipse cx="55" cy="${yw + 2}" rx="12" ry="2.4" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".8"/><ellipse cx="55" cy="${yw + 3.5}" rx="21" ry="3.8" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width=".7"/>` : '';
  const sp = level === 10 ? sparkle(26, 24, 5) + sparkle(86, 30, 4) + sparkle(78, 14, 3.4) : '';
  return defs + `<g clip-path="url(#${id}c)"><rect x="0" y="0" width="110" height="100" fill="url(#${id}sky)"/>${sun}${stem}${flower}${water}${pads}${ripples}${sp}</g><circle cx="55" cy="50" r="47" fill="none" stroke="#4A3322" stroke-width="1.2"/>`;
}

// ไอคอนตราอย่างเดียว (ไม่มีป้ายชื่อ) — locked = ยังไม่ปลดล็อก
function toolIconSvg(level, width, locked) {
  const id = 'ti' + (++BADGE_UID);
  const lot = BADGE_STYLE === 'lotus', nm = badgeStageText(level);
  return `<svg viewBox="0 0 110 100" width="${width || 72}" style="display:block;height:auto;${locked ? 'filter:grayscale(1);opacity:.35;' : ''}" role="img" aria-label="${escapeHtml(nm)}"><title>${escapeHtml(nm)}</title>${lot ? lotusInner(level, id) : emblemDefs(id) + emblemInner(level, id)}</svg>`;
}
// ป้ายยศ = โล่โลหะ (เหล็ก/ทองแดง/เงิน/ทอง ตามช่วงขั้น) + ตราชุดเครื่องมือด้านใน + ป้าย "ขั้น N" และชื่อขั้น
const EMBLEM_FIT = {"1":[55,47.1,61.4,75.7],"2":[55,46.3,45.8,60.6],"3":[55,46.3,45.8,60.6],"4":[55,46.3,45.8,60.6],"5":[55,45.5,42,58.8],"6":[55,45.5,42,58.8],"7":[55,45.5,42,58.8],"8":[55,46.2,42,60.2],"9":[55,46.2,42,60.2],"10":[55.5,44.3,60.6,64.1]};  // [กลาง x, กลาง y, กว้าง, สูง] ของแต่ละตราในผืนวาด 110×100 — ใช้ขยายให้เต็มโล่
function rankBadgeSvg(level, width) {
  level = Math.max(1, Math.min(10, Number(level) || 1));
  const w = width || 96, id = 'rb' + (++BADGE_UID);
  const lot = BADGE_STYLE === 'lotus';
  const T = lot ? BADGE_TIERS[[1, 2, 3][lotusGroup(level)]] : BADGE_TIERS[level === 1 ? 0 : level <= 4 ? 1 : level <= 7 ? 2 : 3];
  const name = RANK_NAMES[level - 1] || '', lines = badgeNameLines(name), tool = badgeStageText(level) || '';
  const shield = 'M10 4 H86 Q92 4 92 10 V98 Q92 116 48 136 Q4 116 4 98 V10 Q4 4 10 4 Z';
  const f = "font-family:'ThamPhisut','Sarabun',sans-serif;";
  const nameSvg = lines.length === 1
    ? `<text x="48" y="114" text-anchor="middle" style="${f}font-size:12.5px;" fill="${T.light}">${escapeHtml(lines[0])}</text>`
    : `<text x="48" y="109.5" text-anchor="middle" style="${f}font-size:11.5px;" fill="${T.light}">${escapeHtml(lines[0])}</text><text x="48" y="121" text-anchor="middle" style="${f}font-size:11.5px;" fill="${T.light}">${escapeHtml(lines[1])}</text>`;
  const label = `ขั้น ${level}/10 · ${name} · ${tool}`;
  const fit = EMBLEM_FIT[level] || [55, 50, 110, 100];
  // โหมดเครื่องมือ: ขยายตราให้เต็มพื้นที่ในโล่ (กว้าง ≤ 72, สูง ≤ 68) ; โหมดบัว: ใช้วงกลมขนาดคงที่
  const k = lot ? 0.75 : Math.min(72 / fit[2], 68 / fit[3]);
  const ox = lot ? 55 : fit[0], oy = lot ? 50 : fit[1];   // ย่อผืนวาด 110×100 ให้พอดีในโล่
  return `<svg viewBox="0 -2 96 142" width="${w}" style="display:block;height:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28));" role="img" aria-label="${escapeHtml(label)}">
    <title>${escapeHtml(label)}</title>
    ${lot ? '' : emblemDefs(id)}
    <defs>
      <linearGradient id="${id}m2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${T.light}"/><stop offset=".45" stop-color="${T.mid}"/><stop offset="1" stop-color="${T.dark}"/></linearGradient>
      <filter id="${id}h" x="-10%" y="-10%" width="120%" height="120%"><feMorphology in="SourceAlpha" operator="dilate" radius="1.1" result="d"/><feFlood flood-color="#FFF4DC" flood-opacity=".92"/><feComposite in2="d" operator="in" result="halo"/><feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <path d="${shield}" fill="url(#${id}m2)" stroke="${T.dark}" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="${shield}" transform="translate(48 70) scale(.86) translate(-48 -70)" fill="${T.field}" stroke="${T.dark}" stroke-width="1"/>
    <rect x="30" y="14" width="36" height="14" rx="7" fill="url(#${id}m2)" stroke="${T.dark}" stroke-width=".8"/>
    <text x="48" y="24.2" text-anchor="middle" style="${f}font-size:10.5px;" fill="${T.dark}">ขั้น ${level}</text>
    <g transform="translate(${(48 - ox * k).toFixed(2)} ${(65 - oy * k).toFixed(2)}) scale(${k.toFixed(3)})"${lot ? '' : ` filter="url(#${id}h)"`}>${lot ? lotusInner(level, id) : emblemInner(level, id)}</g>
    ${nameSvg}
  </svg>`;
}

// ขั้นรวมคำนวณจากแต้มสำนัก: ทุก 5 แต้ม = 1 ขั้น (ขั้น 1 = 0–4.9 … ขั้น 10 = 45 แต้มขึ้นไป)
const RANK_PTS = 5;
function rankLevelOf(st) { return Math.max(1, Math.min(10, Math.floor((Number(st.rank_points) || 0) / RANK_PTS + 1e-9) + 1)); }

// แถวหัวการ์ดศิษย์ (รูปโปรไฟล์ + ข้อมูล + กราฟ) ใช้ร่วมกันทั้งหน้ารายชื่อและหน้ารายละเอียด
function studentHeaderRow(st, opt) {
  opt = opt || {};
  const initial = (st.nickname || st.full_name || '?').charAt(0);
  const stats = opt.statsHtml ? opt.statsHtml : opt.detail
    ? `<div class="meta">เกิด ${fmtThaiDate(st.birthdate)}</div>`
    : `<div style="font-size:calc(11.5px * var(--fs));color:#777;line-height:1.75;">
          แต้มสำนัก <strong style="color:var(--black);">${st.rank_points.toFixed(1)}</strong><br>
          เข้าเรียน <strong style="color:var(--black);">${opt.attPresent}/${opt.attTotal}</strong> ครั้งที่เช็ค<br>
          ส่งงานแล้ว <strong style="color:var(--black);">${st.submissions.length}</strong> ชิ้น · สอบแล้ว <strong style="color:var(--black);">${st.exam_attempts.length}</strong> ครั้ง
        </div>`;
  return `
    <div class="sh-row">
      <div class="hd sh-photo" style="width:120px;aspect-ratio:3/4;box-sizing:border-box;border:3px solid var(--red) !important;box-shadow:0 2px 8px rgba(139,38,53,.25);flex-shrink:0;border-radius:11px;background:var(--gold-light);display:flex;align-items:center;justify-content:center;font-size:calc(40px * var(--fs));font-weight:700;color:var(--red);${st.photo ? `background:url('${st.photo}') center/cover;` : ''}">${st.photo ? '' : escapeHtml(initial)}</div>
      <div class="sh-info">
        <div class="hd" style="font-size:calc(23px * var(--fs));line-height:1.25;">${escapeHtml(st.full_name)}</div>
        <div class="meta">${escapeHtml(st.nickname)} · ${escapeHtml(st.room)} เลขที่ ${escapeHtml(st.seat_no)}</div>
        <div class="meta" style="margin:4px 0 6px;">ขั้นรวม <strong style="color:var(--black);">${rankLevelOf(st)}/10</strong> · <span class="hi">${RANK_NAMES[rankLevelOf(st)-1] || '-'}</span></div>
        ${stats}
      </div>
      <div class="sh-radar">${radarSvg(st.ability, 240)}</div>
      <div class="sh-badge">${rankBadgeSvg(rankLevelOf(st), 96)}</div>
    </div>`;
}

function renderTeacherRoster() {
  const cards = DEMO.roster.map(st => {
    const attTotal = DEMO.attendance.filter(a => a.records.some(r => r.student_id === st.student_id)).length;
    const attPresent = DEMO.attendance.filter(a => a.records.some(r => r.student_id === st.student_id && r.status === 'present')).length;
    return `<div class="card" style="cursor:pointer;padding:12px;" onclick="openStudentDetail('${st.student_id}')">${studentHeaderRow(st, { attPresent, attTotal })}</div>`;
  }).join('');
  byId('teacher-body').innerHTML = `<h2 style="color:var(--red);margin:4px 0 12px;">ศิษย์ในสำนัก — คลิกการ์ดเพื่อดูรายละเอียด</h2>${cards}`;
}

// ---------- รายละเอียดศิษย์รายคน: ประวัติเข้าเรียน / ส่งงาน / สอบ ----------
function openStudentDetail(studentId) {
  const st = DEMO.roster.find(s => s.student_id === studentId);
  if (!st) return;

  const attRows = [];
  DEMO.attendance.forEach(a => {
    const rec = a.records.find(r => r.student_id === studentId);
    if (rec) { const s = findSubject(a.subject_id); attRows.push({ date: a.date, subject: s ? s.subject_name : '', status: rec.status }); }
  });
  attRows.sort((x, y) => y.date.localeCompare(x.date));
  const statusLabel = Object.fromEntries(ATT_KEYS.map(k => [k, ATT_STATUS[k].label]));
  const statusBadge = Object.fromEntries(ATT_KEYS.map(k => [k, ATT_STATUS[k].badge]));
  const attHtml = attRows.map(r => `<div class="row"><div>${fmtThaiDate(r.date)} <span class="meta">${escapeHtml(r.subject)}</span></div><div><span class="badge ${statusBadge[r.status]}">${statusLabel[r.status]}</span></div></div>`).join('')
    || '<p style="color:#999;font-size:calc(13px * var(--fs));">ยังไม่มีประวัติการเช็คชื่อ</p>';

// ---------- คลังความรู้ ----------
// ============================== บอร์ดบทความความรู้ ==============================
// ระดับของบทความอ้างอิงขั้นของลูกศิษย์ 10 ขั้น: a.rank = ขั้นต่ำที่เหมาะจะอ่าน (1–10)
function artRank(a) { const n = Number(a && a.rank); return n >= 1 && n <= 10 ? Math.round(n) : ({ basic: 1, mid: 4, deep: 7 }[a && a.level] || 1); }
function artRankShort(a) { return 'ขั้น ' + artRank(a) + (artRank(a) < 10 ? '+' : ''); }
function artRankLong(a) { const n = artRank(a); return 'เหมาะกับขั้น ' + n + (n < 10 ? ' ขึ้นไป' : '') + ' · ' + RANK_NAMES[n - 1]; }
const TART = { subjectId: null, open: false, editId: null, imgs: [], previewId: null, confirmDel: null };
function artsOf(s) { if (!s.articles) s.articles = []; return s.articles; }
function artSorted(list) { return list.slice().sort((x, y) => (y.pinned ? 1 : 0) - (x.pinned ? 1 : 0) || String(y.updated_at).localeCompare(String(x.updated_at))); }
function artUnits(s) {
  const set = new Set();
  artsOf(s).forEach(a => a.unit && set.add(a.unit));
  if (s.report) s.report.comps.forEach(c => c.unit && set.add(c.unit));
  return Array.from(set);
}
function artHl(text, q) {
  const e = escapeHtml(text || '');
  if (!q) return e;
  const re = new RegExp(escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return e.replace(re, m => `<mark style="background:#F0D878;border-radius:3px;">${m}</mark>`);
}
// แสดงเนื้อหา: เว้นบรรทัดว่าง = ย่อหน้า · ขึ้นต้น # = หัวข้อย่อย · ขึ้นต้น • หรือ - = รายการ
function artBodyHtml(text, q) {
  const blocks = String(text || '').split(/\n\s*\n/).map(t => t.trim()).filter(Boolean);
  return blocks.map(b => {
    const lines = b.split('\n');
    if (/^#\s+/.test(b)) return `<h3 class="hd" style="font-size:calc(18px * var(--fs));color:var(--red);margin:16px 0 4px;">${artHl(b.replace(/^#\s+/, ''), q)}</h3>`;
    if (lines.every(l => /^\s*[•\-]\s+/.test(l))) return `<ul style="margin:6px 0 10px;padding-left:22px;line-height:1.75;">${lines.map(l => `<li>${artHl(l.replace(/^\s*[•\-]\s+/, ''), q)}</li>`).join('')}</ul>`;
    return `<p style="line-height:1.8;margin:0 0 12px;">${artHl(b, q).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}
function artReaderHtml(a, opt) {
  opt = opt || {};
  const imgs = (a.images || []).map(im => !im.src ? '<div class="meta" style="margin:10px 0;text-align:center;">⏳ กำลังโหลดรูป…</div>' : `<figure style="margin:10px 0;"><img src="${im.src}" style="width:100%;max-height:420px;object-fit:contain;background:#F7F2E6;border-radius:10px;border:1px solid var(--line);display:block;"><figcaption class="meta" style="margin-top:4px;text-align:center;">${escapeHtml(im.caption || '')}</figcaption></figure>`).join('');
  const qs = (a.questions || []).length ? `<div style="background:#F5EBD0;border-radius:12px;padding:12px;margin-top:14px;"><div class="hd" style="font-size:calc(17px * var(--fs));color:var(--red);">💭 คำถามชวนคิด</div><ol style="margin:6px 0 0;padding-left:22px;line-height:1.75;">${a.questions.map(q => `<li>${escapeHtml(q)}</li>`).join('')}</ol></div>` : '';
  const tags = (a.tags || []).length ? `<div style="margin-top:12px;">${a.tags.map(t => `<span class="badge">#${escapeHtml(t)}</span>`).join(' ')}</div>` : '';
  const src = a.source ? `<div class="meta" style="margin-top:10px;">📚 ที่มา/อ้างอิง: ${escapeHtml(a.source)}</div>` : '';
  const link = a.link ? `<div style="margin-top:8px;"><a href="${escapeHtml(a.link)}" target="_blank" rel="noopener noreferrer" style="color:#1B5E7A;font-weight:600;">🔗 แหล่งเรียนรู้เพิ่มเติม</a></div>` : '';
  return `<h2 style="margin-bottom:4px;">${escapeHtml(a.title)}</h2>
    <div class="meta" style="margin-bottom:8px;">${a.unit ? '📂 ' + escapeHtml(a.unit) + ' · ' : ''}${artRankLong(a)} · ปรับปรุง ${fmtThaiDate(String(a.updated_at).slice(0, 10))}</div>
    ${opt.myRank && opt.myRank < artRank(a) ? `<div style="background:#FFF4DC;border:1px solid #E6CF8E;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:calc(13.5px * var(--fs));line-height:1.6;">⛰ บทความนี้ยากกว่าขั้นของคุณเล็กน้อย (คุณอยู่ขั้น ${opt.myRank} · เหมาะกับขั้น ${artRank(a)} ขึ้นไป) อ่านช้า ๆ หรือกดถาม AI ท้ายบทความได้เลย</div>` : ''}
    ${a.summary ? `<p style="font-style:italic;color:#6a5a3a;margin:0 0 10px;line-height:1.7;">${artHl(a.summary, opt.q)}</p>` : ''}
    ${imgs}${artBodyHtml(a.body, opt.q)}${qs}${tags}${src}${link}`;
}

function renderKnowledgeTab(s) {

function artReadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const sc = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); let d = c.toDataURL('image/jpeg', 0.6); if (d.length > 120000) d = c.toDataURL('image/jpeg', 0.4); res(d); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('อ่านไฟล์รูปไม่ได้')); };
    img.src = url;
  });
}
async function artAddImages(input) {
  const files = Array.from(input.files || []), room = 4 - TART.imgs.length, err = byId('art_err');
  if (err) err.textContent = '';
  for (const f of files.slice(0, Math.max(0, room))) {
    try { TART.imgs.push({ src: await artReadImage(f), caption: '' }); } catch (e) { if (err) err.textContent = e.message; }
  }
  if (files.length > room && err) err.textContent = 'แนบได้สูงสุด 4 รูป';
  input.value = '';
  byId('art_imgs').innerHTML = artImgsHtml();
}
function artRemoveImg(i) { TART.imgs.splice(i, 1); byId('art_imgs').innerHTML = artImgsHtml(); }
function artSave() {
  const s = curSubject(), g = id => (byId(id) ? byId(id).value : ''), err = byId('art_err');
  const title = g('art_title').trim(), body = g('art_body').trim();
  if (!title) { err.textContent = 'ใส่ชื่อเรื่องก่อน'; return; }
  if (!body && !TART.imgs.length) { err.textContent = 'ใส่เนื้อหาหรือแนบรูปอย่างน้อยหนึ่งอย่าง'; return; }
  let link = g('art_link').trim();
  if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
  const data = {
    title, unit: g('art_unit').trim(), summary: g('art_summary').trim(), body,
    images: TART.imgs.map(im => ({ src: im.src, caption: (im.caption || '').trim() })),
    rank: Math.max(1, Math.min(10, Number(g('art_rank')) || 1)), tags: g('art_tags').split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean),
    questions: g('art_q').split('\n').map(t => t.trim()).filter(Boolean), source: g('art_source').trim(), link,
    pinned: !!(byId('art_pin') && byId('art_pin').checked), status: g('art_status') || 'published', updated_at: new Date().toISOString(),
  };
  const list = artsOf(s);
  if (TART.editId) { const a = list.find(x => x.id === TART.editId); if (a) Object.assign(a, data); }
  else list.push(Object.assign({ id: 'ART_' + Date.now().toString(36), readers: [], created_at: data.updated_at }, data));
  TART.open = false; TART.editId = null; TART.imgs = [];
  renderKnowledgeTab(s);
}

  const s = findSubject(subjectId);
  s.exams[idx].status = status;
  s.exams[idx][status === 'released' ? 'released_at' : 'closed_at'] = new Date().toISOString();
  renderExamTab(s);
}

async function generateExam(subjectId) {
  const s = findSubject(subjectId);
  const title = byId('exam_title').value.trim();
  const count = parseInt(byId('exam_count').value, 10) || 5;
  const duration = parseInt(byId('exam_duration').value, 10) || 15;
  if (!title) { byId('exam_err').textContent = 'ตั้งชื่อชุดข้อสอบก่อน'; return; }
  const btn = byId('exam_btn');
  btn.disabled = true; btn.textContent = 'AI กำลังออกข้อสอบ...';
  byId('exam_err').textContent = '';
  const sample = await ensureSample();
  if (!sample) { byId('exam_err').textContent = 'ไม่พบความสามารถเรียก AI ในมุมมองนี้'; btn.disabled=false; btn.textContent='สร้างข้อสอบปรนัย 4 ตัวเลือกด้วย AI'; return; }
  try {
    const prompt = `จากคำอธิบายรายวิชาต่อไปนี้ ให้สร้างข้อสอบปรนัย 4 ตัวเลือก จำนวน ${count} ข้อ ครอบคลุมเนื้อหาสำคัญ ระดับความยากเหมาะกับนักเรียน${s.level} แต่ละข้อมีตัวเลือกที่ชัดเจน ไม่กำกวม\n\nชื่อวิชา: ${s.subject_name}\nคำอธิบายรายวิชา: ${s.description}\n\nตอบเป็น JSON array เท่านั้น รูปแบบ: [{"question":"...","choices":["...","...","...","..."],"correct_index":0}] โดย correct_index คือตำแหน่ง (0-3) ของตัวเลือกที่ถูกต้อง`;
    const data = await sample.json(prompt, { modelTier: 'default' });
    if (!Array.isArray(data) || data.length === 0) throw { code:'invalid_json', message:'รูปแบบไม่ถูกต้อง' };
    s.exams.push({ title, questions: data, duration_minutes: duration, status: 'draft', created_at: new Date().toISOString() });
    renderExamReview(s.subject_id, s.exams.length - 1); // ให้ครูตรวจทาน/แก้ไขก่อน แทนที่จะกลับไปหน้ารายการเลย
  } catch (e) {
    byId('exam_err').textContent = aiErrorMessage(e);
    btn.disabled = false; btn.textContent = 'สร้างข้อสอบปรนัย 4 ตัวเลือกด้วย AI';
  }
}

// ---------- ตรวจทาน/แก้ไขข้อสอบก่อนปล่อยให้นักเรียนทำ ----------
function renderExamReview(subjectId, examIdx) {
  const s = findSubject(subjectId);
  const ex = s.exams[examIdx];
  const qCards = ex.questions.map((q, qi) => `
    <div class="card" style="margin-bottom:10px;">
      <label>คำถามข้อ ${qi + 1}</label>
      <textarea rows="2" onchange="updateExamQuestionText('${subjectId}',${examIdx},${qi},this.value)">${escapeHtml(q.question)}</textarea>
      ${q.choices.map((c, ci) => `
        <div style="display:flex;align-items:center;gap:7px;margin-top:7px;">
          <input type="radio" name="correct_${examIdx}_${qi}" ${q.correct_index===ci?'checked':''} onchange="setExamCorrectChoice('${subjectId}',${examIdx},${qi},${ci})" title="ทำเครื่องหมายว่าเป็นคำตอบที่ถูกต้อง">
          <input style="flex:1;min-width:0;" placeholder="ตัวเลือก ${ci+1}" value="${escapeHtml(c)}" onchange="updateExamChoiceText('${subjectId}',${examIdx},${qi},${ci},this.value)">
        </div>
      `).join('')}
      <button class="btn outline sm" style="margin-top:9px;" onclick="deleteExamQuestion('${subjectId}',${examIdx},${qi})">ลบข้อนี้</button>
    </div>
  `).join('');
  byId('subject-tab-body').innerHTML = `
    <div class="card">
      <h2>ตรวจทานข้อสอบ: ${escapeHtml(ex.title)}</h2>
      <p style="font-size:calc(12.5px * var(--fs));color:#777;margin:0;">แก้คำถาม/ตัวเลือกได้โดยตรง เลือกวงกลมหน้าตัวเลือกเพื่อกำหนดคำตอบที่ถูกต้อง ตรวจครบแล้วค่อยกดปล่อยสอบในหน้าคลังข้อสอบ</p>
    </div>
    ${qCards || '<p style="color:#999;">ไม่มีคำถามเหลืออยู่แล้ว</p>'}
    <button class="btn gold" style="width:100%;" onclick="openSubjectDetail('${subjectId}','exam')">บันทึกและกลับไปหน้าคลังข้อสอบ</button>
  `;
}

function updateExamQuestionText(subjectId, examIdx, qi, value) {
  findSubject(subjectId).exams[examIdx].questions[qi].question = value;
}
function updateExamChoiceText(subjectId, examIdx, qi, ci, value) {
  findSubject(subjectId).exams[examIdx].questions[qi].choices[ci] = value;
}
function setExamCorrectChoice(subjectId, examIdx, qi, ci) {
  findSubject(subjectId).exams[examIdx].questions[qi].correct_index = ci;
}
function deleteExamQuestion(subjectId, examIdx, qi) {
  const s = findSubject(subjectId);
  s.exams[examIdx].questions.splice(qi, 1);
  renderExamReview(subjectId, examIdx);
}

function switchStudentTab(tab) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.t === tab));

  else if (tab === 'ranks') renderStudentRanks();
  else if (tab === 'knowledge') renderStudentKnowledge();
  else if (tab === 'exam') renderStudentExamList();
  else if (tab === 'work') renderStudentWorkList();
  else renderStudentProfile();
}

    const prompt = `จากคำอธิบายรายวิชาต่อไปนี้ ให้สรุปเนื้อหาความรู้สำคัญสำหรับนักเรียนทบทวนก่อนสอบ แบ่งเป็นหัวข้อย่อย 3-5 หัวข้อ แต่ละหัวข้อมีคำอธิบายสั้นกระชับ เข้าใจง่าย เหมาะกับนักเรียนระดับ${s.level} เขียนเป็นข้อความธรรมดา ไม่ต้องใช้ markdown พิเศษ และเว้นบรรทัดว่างระหว่างหัวข้อ\n\nชื่อวิชา: ${s.subject_name}\nคำอธิบายรายวิชา: ${s.description}`;
    const { text } = await sample(prompt, { modelTier: 'default' });
    s.knowledge = text;
    filterStudentKnowledge();
  } catch (e) { err.textContent = aiErrorMessage(e); btn.disabled = false; btn.textContent = 'สรุปความรู้ของวิชานี้ด้วย AI'; }
}

function renderStudentExamList() {
  const released = [];
  DEMO.subjects.forEach(s => s.exams.forEach((ex, i) => { if (ex.status === 'released') released.push({ s, ex, i }); }));
  const rows = released.map(({s,ex,i}) => {
    const attempted = DEMO.student.exam_attempts.find(a => a.subject_id===s.subject_id && a.exam_index===i);
    return `<div class="row">
      <div><strong>${escapeHtml(ex.title)}</strong><div class="meta">${escapeHtml(s.subject_name)} · ${ex.questions.length} ข้อ · ${ex.duration_minutes} นาที</div></div>
      <div>${attempted ? `<span class="badge gold">ทำแล้ว ${attempted.score}/${ex.questions.length}</span>` : `<button class="btn red sm" onclick="startExam('${s.subject_id}',${i})">เริ่มทำ</button>`}</div>
    </div>`;
  }).join('') || '<p style="color:#999;font-size:calc(13.5px * var(--fs));">ยังไม่มีข้อสอบที่ครูปล่อยให้ทำตอนนี้</p>';
  byId('student-body').innerHTML = `<div class="card"><h2>ข้อสอบที่เปิดให้ทำ</h2>${rows}</div>`;
}

// ---------- ทำข้อสอบ + จับเวลา ----------
function startExam(subjectId, examIndex) {
  const s = findSubject(subjectId);
  const ex = s.exams[examIndex];
  EXAM_RUNNER = { subjectId, examIndex, answers: new Array(ex.questions.length).fill(null), startAt: Date.now(), endAt: Date.now() + ex.duration_minutes*60*1000, submitted:false };
  renderExamQuestion(0);
  tickExamTimer();
}

function tickExamTimer() {
  if (!EXAM_RUNNER || EXAM_RUNNER.submitted) return;
  const remain = Math.max(0, EXAM_RUNNER.endAt - Date.now());
  const el = byId('exam-timer');
  if (el) {
    const m = Math.floor(remain/60000), sec = Math.floor((remain%60000)/1000);
    el.textContent = String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }
  if (remain <= 0) { submitExam(true); return; }
  setTimeout(tickExamTimer, 1000);
}

function renderExamQuestion(qIdx) {
  if (!EXAM_RUNNER) return;
  const s = findSubject(EXAM_RUNNER.subjectId);
  const ex = s.exams[EXAM_RUNNER.examIndex];
  const q = ex.questions[qIdx];
  const selected = EXAM_RUNNER.answers[qIdx];
  const choices = q.choices.map((c,i) => `<button class="choice-btn ${selected===i?'selected':''}" onclick="selectExamAnswer(${qIdx},${i})">${String.fromCharCode(65+i)}. ${escapeHtml(c)}</button>`).join('');
  byId('student-body').innerHTML = `
    <div class="card">
      <div class="timer" id="exam-timer">--:--</div>
      <p style="text-align:center;font-size:calc(12.5px * var(--fs));color:#888;margin:4px 0 14px;">ข้อ ${qIdx+1} / ${ex.questions.length}</p>
      <p style="font-size:calc(15.5px * var(--fs));font-weight:600;">${escapeHtml(q.question)}</p>
      ${choices}
      <div style="display:flex;justify-content:space-between;margin-top:16px;">
        <button class="btn outline" ${qIdx===0?'disabled':''} onclick="renderExamQuestion(${qIdx-1})">ก่อนหน้า</button>
        ${qIdx < ex.questions.length-1
          ? `<button class="btn gold" onclick="renderExamQuestion(${qIdx+1})">ถัดไป</button>`
          : `<button class="btn red" onclick="submitExam(false)">ส่งคำตอบ</button>`}
      </div>
    </div>
  `;
  tickExamTimer();
}

function selectExamAnswer(qIdx, choiceIdx) {
  EXAM_RUNNER.answers[qIdx] = choiceIdx;
  renderExamQuestion(qIdx);
}

function submitExam(timedOut) {
  if (!EXAM_RUNNER || EXAM_RUNNER.submitted) return;
  EXAM_RUNNER.submitted = true;
  const s = findSubject(EXAM_RUNNER.subjectId);
  const ex = s.exams[EXAM_RUNNER.examIndex];
  let correct = 0;
  ex.questions.forEach((q,i) => { if (EXAM_RUNNER.answers[i] === q.correct_index) correct++; });
  DEMO.student.exam_attempts.push({ subject_id: EXAM_RUNNER.subjectId, exam_index: EXAM_RUNNER.examIndex, score: correct, submitted_at: new Date().toISOString(), timed_out: timedOut });
  const usedMs = Date.now() - (EXAM_RUNNER.startAt || Date.now()), speedGain = (!timedOut && usedMs <= ex.duration_minutes * 60 * 1000 / 2) ? GAIN.speedFast : 0;
  if (speedGain) addAbility('speed', speedGain);
  addAbility('intelligence', correct * GAIN.perCorrect);
  DEMO.student.rank_points += correct * 0.3;
  byId('student-body').innerHTML = `
    <div class="card">
      <h2>${timedOut ? 'หมดเวลา — ส่งอัตโนมัติ' : 'ส่งคำตอบแล้ว'}</h2>
      <p style="font-size:calc(28px * var(--fs));font-weight:700;color:var(--red);text-align:center;margin:10px 0;">${correct} / ${ex.questions.length}</p>
      <p style="text-align:center;color:#777;font-size:calc(13px * var(--fs));">ด้านปัญญา +${correct * GAIN.perCorrect} คะแนน${speedGain ? ' · ความเร็ว +' + speedGain + ' (ทำเสร็จภายในครึ่งเวลา)' : ''}</p>
      <button class="btn gold" style="width:100%;" onclick="renderStudentExamList()">กลับไปหน้ารายการข้อสอบ</button>
    </div>
  `;
  EXAM_RUNNER = null;
}

// ---------- ส่งงานปฏิบัติ + AI ตรวจ ----------
function renderStudentWorkList() {
  const list = [];
  DEMO.subjects.forEach(s => s.assignments.forEach((a,i) => list.push({s,a,i})));
  const rows = list.map(({s,a,i}) => {
    const sub = DEMO.student.submissions.find(x => x.subject_id===s.subject_id && x.assignment_index===i);
    return `<div class="row">
      <div><strong>${escapeHtml(a.title)}</strong><div class="meta">${escapeHtml(s.subject_name)} · กำหนดส่ง ${a.due_at ? fmtThaiDate(a.due_at) : 'ไม่กำหนด'}</div></div>
      <div>${sub ? `<span class="badge gold">ตรวจแล้ว ${sub.total}/${sub.max_total}</span>` : `<button class="btn red sm" onclick="openSubmitWork('${s.subject_id}',${i})">ส่งงาน</button>`}</div>
    </div>`;
  }).join('') || '<p style="color:#999;font-size:calc(13.5px * var(--fs));">ยังไม่มีหัวข้อชิ้นงานให้ส่ง</p>';
  byId('student-body').innerHTML = `<div class="card"><h2>ชิ้นงานปฏิบัติ</h2>${rows}</div>`;
}

function openSubmitWork(subjectId, idx) {
  const s = findSubject(subjectId);
  const a = s.assignments[idx];
  byId('student-body').innerHTML = `
    <div class="card">
      <h2>${escapeHtml(a.title)}</h2>
      <p style="font-size:calc(12.5px * var(--fs));color:#777;">เกณฑ์: ${a.rubric.map(r=>r.name+' ('+r.max+')').join(' · ')}</p>
      <label>อัปโหลดรูปผลงาน</label>
      <input type="file" id="work_file" accept="image/*" onchange="previewWorkFile(this)">
      <label for="work_file" class="btn outline" style="display:block;text-align:center;cursor:pointer;margin-top:4px;border:1.5px dashed var(--red);color:var(--red);padding:16px;font-weight:600;">📷 เลือกรูป / ถ่ายภาพผลงาน</label>
      <div id="work_preview" style="margin-top:10px;"></div>
      <div id="work_err" class="error-msg"></div>
      <button class="btn gold" id="work_btn" onclick="submitWork('${subjectId}',${idx})">ส่งงานให้ AI ตรวจ</button>
    </div>
  `;
}

function previewWorkFile(input) {
  const f = input.files && input.files[0];
  const box = byId('work_preview');
  if (!f) { box.innerHTML = ''; return; }
  const url = URL.createObjectURL(f);
  box.innerHTML = `<img src="${url}" style="max-width:100%;max-height:340px;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto;"><div class="meta" style="text-align:center;margin-top:6px;">${escapeHtml(f.name)} · แตะปุ่มด้านบนเพื่อเปลี่ยนรูป</div>`;
  byId('work_err').textContent = '';
}

async function submitWork(subjectId, idx) {
  const s = findSubject(subjectId);
  const a = s.assignments[idx];
  const fileInput = byId('work_file');
  const file = fileInput.files[0];
  if (!file) { byId('work_err').textContent = 'เลือกรูปภาพก่อน'; return; }
  const btn = byId('work_btn');
  btn.disabled = true; btn.textContent = 'AI กำลังตรวจงาน...';
  byId('work_err').textContent = '';
  const sample = await ensureSample();
  if (!sample) { byId('work_err').textContent = 'ไม่พบความสามารถเรียก AI ในมุมมองนี้'; btn.disabled=false; btn.textContent='ส่งงานให้ AI ตรวจ'; return; }
  if (!SAMPLE_LIMITS || !SAMPLE_LIMITS.images) { byId('work_err').textContent = 'มุมมองนี้ส่งรูปภาพให้ AI ไม่ได้ (images_unavailable)'; btn.disabled=false; btn.textContent='ส่งงานให้ AI ตรวจ'; return; }
  try {
    const rubricText = a.rubric.map((r,i) => `${i+1}. ${r.name} (เต็ม ${r.max} คะแนน)`).join('\n');
    const prompt = `ประเมินผลงานการเขียนภาพจิตรกรรมไทยแบบประเพณีของนักเรียนในภาพที่แนบมา ตามหัวข้อชิ้นงาน "${a.title}" ของวิชา ${s.subject_name}\n\nให้คะแนนตามเกณฑ์นี้ (ไม่เกินคะแนนเต็มแต่ละข้อ):\n${rubricText}\n\nเขียนความเห็นสั้น ๆ ให้กำลังใจและชี้แนวทางพัฒนา\n\nตอบเป็น JSON เท่านั้น รูปแบบ: {"criteria":[{"name":"...","score":0,"comment":"..."}],"overall":"..."}`;
    const result = await sample.json(prompt, { images: [file], modelTier: 'default' });
    const total = (result.criteria || []).reduce((sum,c) => sum + (Number(c.score)||0), 0);
    const maxTotal = a.rubric.reduce((sum,r) => sum + r.max, 0);
    const onTime = !a.due_at || new Date() <= new Date(a.due_at + 'T23:59:59');
    DEMO.student.submissions.push({ subject_id: subjectId, assignment_index: idx, result, total, max_total: maxTotal, on_time: onTime, submitted_at: new Date().toISOString() });
    addAbility('skill', Math.round(total / maxTotal * GAIN.skillMax));
    addAbility('perseverance', GAIN.perseverance);
    if (onTime) addAbility('punctuality', GAIN.punctuality);
    DEMO.student.rank_points += total/maxTotal*2;
    renderWorkResult(result, total, maxTotal, onTime);
  } catch (e) {
    byId('work_err').textContent = aiErrorMessage(e);
    btn.disabled = false; btn.textContent = 'ส่งงานให้ AI ตรวจ';
  }
}

function renderWorkResult(result, total, maxTotal, onTime) {
  const rows = (result.criteria||[]).map(c => `<div class="row"><div>${escapeHtml(c.name)}</div><div><strong>${c.score}</strong></div></div>`).join('');
  byId('student-body').innerHTML = `
    <div class="card">
      <h2>ผลตรวจจาก AI</h2>
      <p style="font-size:calc(26px * var(--fs));font-weight:700;color:var(--red);text-align:center;margin:8px 0;">${total} / ${maxTotal}</p>
      ${rows}
      <p style="margin-top:10px;font-size:calc(14px * var(--fs));line-height:1.6;">${escapeHtml(result.overall||'')}</p>
      <p style="font-size:calc(12.5px * var(--fs));color:#777;">ทักษะฝีมือ +${Math.round(total/maxTotal*GAIN.skillMax)} · ความเพียร +${GAIN.perseverance} ${onTime ? '· ตรงต่อเวลา +' + GAIN.punctuality : '(ส่งช้ากว่ากำหนด)'}</p>
      <button class="btn gold" style="width:100%;" onclick="renderStudentWorkList()">กลับไปหน้ารายการชิ้นงาน</button>
    </div>
  `;
}

// ---------- โปรไฟล์ ----------
function renderStudentProfile() {
  const st = DEMO.student;
  byId('student-body').innerHTML = `
    <div class="card">
      <h2>โปรไฟล์ของฉัน</h2>
      <div style="display:flex;align-items:center;gap:14px;margin:4px 0 6px;">
        <div class="hd" style="width:120px;aspect-ratio:3/4;box-sizing:border-box;border:3px solid var(--red) !important;box-shadow:0 2px 8px rgba(139,38,53,.25);border-radius:11px;flex-shrink:0;background:var(--gold-light) ${st.photo ? `url('${st.photo}') center/cover` : ''};display:flex;align-items:center;justify-content:center;font-size:calc(40px * var(--fs));font-weight:700;color:var(--red);">${st.photo ? '' : escapeHtml((st.nickname || st.full_name || '?').charAt(0))}</div>
        <div>
          <label for="p_photo" class="btn gold sm" style="display:inline-block;margin:0;cursor:pointer;color:var(--black);font-size:calc(13px * var(--fs));">${st.photo ? 'เปลี่ยนรูปโปรไฟล์' : 'เพิ่มรูปโปรไฟล์'}</label>
          <input type="file" id="p_photo" accept="image/*" onchange="handlePhotoPick(this,'student')">
          ${st.photo ? '<button class="btn outline sm" style="margin-left:6px;" onclick="removePhoto(\'student\')">ลบรูป</button>' : ''}
          <div class="meta" style="margin-top:6px;">ระบบจะครอบรูปเป็นสัดส่วน กว้าง 1.5 : สูง 2 (3:4) อัตโนมัติ</div>
        </div>
      </div>
      <label>คำนำหน้า</label>
      <select id="p_prefix" disabled>${['', 'เด็กชาย','เด็กหญิง','นาย','นางสาว','นาง'].map(x => `<option value="${x}" ${st.prefix === x ? 'selected' : ''}>${x || '— เลือก —'}</option>`).join('')}</select>
      <label>ชื่อ-นามสกุล (ไม่ต้องใส่คำนำหน้า)</label><input id="p_name" readonly value="${escapeHtml(st.full_name)}">
      <div class="meta">ชื่อ-นามสกุล ห้อง และเลขที่ ครูเป็นผู้แก้ไข · นักเรียนแก้ได้เฉพาะชื่อเล่น วันเกิด และรูป</div>
      <label>ชื่อเล่น</label><input id="p_nick" value="${escapeHtml(st.nickname)}">
      <label>ชั้น/ห้อง</label><input id="p_room" readonly value="${escapeHtml(st.room)}">
      <label>เลขที่</label><input id="p_seat" readonly value="${escapeHtml(st.seat_no)}">
      <label>วันเกิด</label>${dateField('p_bday', st.birthdate)}
      <button class="btn gold" onclick="saveProfile()">บันทึก</button>
    </div>
  `;
}

function handlePhotoPick(input, who) {
  const f = input.files && input.files[0];
  if (!f) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = () => {
    const W = 240, H = 320, c = document.createElement('canvas'); c.width = W; c.height = H;
    // ครอบกลางภาพให้ได้สัดส่วน 3:4 (กว้าง 1.5 : สูง 2)
    let sw = img.width, sh = img.width * 4 / 3;
    if (sh > img.height) { sh = img.height; sw = img.height * 3 / 4; }
    c.getContext('2d').drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, W, H);
    (who === 'teacher' ? DEMO.teacher : DEMO.student).photo = c.toDataURL('image/jpeg', 0.7);
    if (window.pwaPhotoChanged) pwaPhotoChanged(who);
    URL.revokeObjectURL(url);
    if (who === 'teacher') { keepTeacherDraft(); renderTeacherProfile(); } else { keepProfileDraft(); renderStudentProfile(); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('อ่านไฟล์รูปไม่ได้ ลองเลือกรูปอื่น'); };
  img.src = url;
}
function removePhoto(who) {
  if (who === 'teacher') { DEMO.teacher.photo = ''; keepTeacherDraft(); renderTeacherProfile(); }
  else { DEMO.student.photo = ''; keepProfileDraft(); renderStudentProfile(); }
}
function keepProfileDraft() {
  const st = DEMO.student, g = id => byId(id) && byId(id).value;
  if (g('p_prefix') != null) st.prefix = g('p_prefix');
  if (g('p_name') != null) { st.full_name = g('p_name').trim() || st.full_name; st.nickname = g('p_nick').trim(); st.room = g('p_room').trim(); st.seat_no = g('p_seat').trim(); if (g('p_bday')) st.birthdate = g('p_bday'); }
}

function saveProfile() {
  const st = DEMO.student;
  st.prefix = byId('p_prefix').value;
  st.full_name = byId('p_name').value.trim();
  st.nickname = byId('p_nick').value.trim();
  st.room = byId('p_room').value.trim();
  st.seat_no = byId('p_seat').value.trim();
  st.birthdate = byId('p_bday').value;
  showStudentDashboard();
}

const XL_REC = "บันทึกผลการเรียน (12)";
const XL_SLOTS = [['B','C','D'], ['G','H','I','J'], ['L','M','N','O'], ['Q','R','S'], ['V','W','X']];
const XL_SUMCOL = ['F','K','P','U','Z'];
const XL_COND = ['AA','AB','AC','AD','AE','AF','AG','AH','AI','AJ'];
const XL_ATT_COLS = 30;    // D..AG
const XL_CAPACITY = 25;    // จำนวนแถวนักเรียนในฟอร์ม
const XL2_SLOTS = [['B','C','D','E'], ['G','H','I','J'], ['L','M','N'], ['Q','R','S'], ['V','W','X']];   // ฟอร์มแกนมัธยม
const XL2_ATT_COLS = 29;   // D..AF
const XL_TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function xlColNum(c) { let n = 0; for (const ch of c) n = n * 26 + ch.charCodeAt(0) - 64; return n; }
function xlColName(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function xlSplit(ref) { const m = /^([A-Z]+)(\d+)$/.exec(ref); return [m[1], +m[2]]; }
function xlEsc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function xlSerial(iso) { const [y, m, d] = iso.split('-').map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000); }
function xlGrade(k) {
  if (k > 100) return 'คะแนนเกิน';
  if (k >= 80) return 4; if (k >= 75) return 3.5; if (k >= 70) return 3; if (k >= 65) return 2.5;
  if (k >= 60) return 2; if (k >= 55) return 1.5; if (k >= 50) return 1; return 0;
}

class XlSheet {
  constructor(xml) {
    this.doc = new DOMParser().parseFromString(xml, 'application/xml');
    this.ns = this.doc.documentElement.namespaceURI;
    this.sd = this.doc.getElementsByTagName('sheetData')[0];
    this.rows = new Map();
    for (const r of Array.from(this.sd.children)) this.rows.set(+r.getAttribute('r'), r);
  }
  row(n) {
    if (this.rows.has(n)) return this.rows.get(n);
    const el = this.doc.createElementNS(this.ns, 'row'); el.setAttribute('r', String(n));
    let before = null;
    for (const [k, v] of this.rows) if (k > n && (!before || k < +before.getAttribute('r'))) before = v;
    this.sd.insertBefore(el, before); this.rows.set(n, el); return el;
  }
  cell(ref) {
    const [col, rn] = xlSplit(ref), row = this.row(rn), cn = xlColNum(col);
    let before = null;
    for (const c of Array.from(row.children)) {
      const cc = xlColNum(xlSplit(c.getAttribute('r'))[0]);
      if (cc === cn) return c;
      if (cc > cn) { before = c; break; }
    }
    const el = this.doc.createElementNS(this.ns, 'c'); el.setAttribute('r', ref);
    row.insertBefore(el, before); return el;
  }
  set(ref, spec, style) {
    const c = this.cell(ref);
    if (style != null) c.setAttribute('s', String(style));
    for (const ch of Array.from(c.children)) c.removeChild(ch);
    c.removeAttribute('t');
    const mk = (name, text) => { const e = this.doc.createElementNS(this.ns, name); if (text != null) e.textContent = String(text); return e; };
    if (spec == null) return;
    if (spec.n != null) { c.appendChild(mk('v', spec.n)); }
    else if (spec.s != null) {
      c.setAttribute('t', 'inlineStr');
      const is = mk('is'), t = mk('t', spec.s); t.setAttribute('xml:space', 'preserve'); is.appendChild(t); c.appendChild(is);
    } else if (spec.f != null) {
      c.appendChild(mk('f', spec.f));
      if (typeof spec.v === 'string') { c.setAttribute('t', 'str'); c.appendChild(mk('v', spec.v)); }
      else if (spec.v != null) c.appendChild(mk('v', spec.v));
    }
  }
  xml() {
    let s = new XMLSerializer().serializeToString(this.doc);
    if (!s.startsWith('<?xml')) s = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' + s;
    return s;

function xlThaiDateParts(iso) { const [y, m, d] = iso.split('-').map(Number); return { d: String(d), m: XL_TH_MONTHS[m - 1], y: String(y + 543) }; }

function xlBuildDrawing(xml, rounds) {
  // ตามต้นฉบับ: รอบที่ไม่เปิดสอนจะถูกขีดฆ่าวงกลม (ต้นฉบับขีดที่ "รอบค่ำ")
  const re = /<xdr:twoCellAnchor[\s\S]*?<\/xdr:twoCellAnchor>/g;
  const anchors = xml.match(re) || [];
  const cx = anchors.find(a => a.includes('<xdr:cxnSp'));
  if (!cx) return xml;
  let out = xml.replace(cx, '');
  const cols = [3, 5, 7], ellX = [2639750, 4210050, 5791200], keys = ['morning', 'afternoon', 'evening'];
  let clones = '', id = 20;
  keys.forEach((k, i) => {
    if (rounds && rounds[k]) return;
    let c = cx.replace(/<xdr:col>7<\/xdr:col>/g, `<xdr:col>${cols[i]}</xdr:col>`);
    c = c.replace(/<a:off x="5829497"/, `<a:off x="${5829497 - (5791200 - ellX[i])}"`);
    c = c.replace(/<xdr:cNvPr id="\d+" name="[^"]*">[\s\S]*?<\/xdr:cNvPr>/, `<xdr:cNvPr id="${id}" name="ขีดฆ่ารอบ ${i + 1}"/>`);
    c = c.replace(/<xdr:cNvCxnSpPr>[\s\S]*?<\/xdr:cNvCxnSpPr>/, '<xdr:cNvCxnSpPr/>');
    id++; clones += c;
  });
  return out.replace('</xdr:wsDr>', clones + '</xdr:wsDr>');
}

function xlMark(status) {
  if (status === 'present' || status === 'late') return 'P';
  if (status === 'sick' || status === 'personal') return 'ล';
  if (status === 'absent') return 'ข';
  return '';
}
function xlCompute(d, s) {
  const comp = [0, 1, 2, 3, 4].map(ci => {
    const items = (d.comps[ci] && d.comps[ci].items) || [];
    return items.reduce((a, it, k) => { const v = s.c && s.c[ci] ? Number(s.c[ci][k]) : 0; return a + (isNaN(v) ? 0 : Math.min(v, it.max)); }, 0);
  });
  const part70 = comp.reduce((a, b) => a + b, 0);
  const conduct = (s.j || []).reduce((a, v) => a + (isNaN(Number(v)) ? 0 : Math.min(Number(v), 3)), 0);
  const total = part70 + conduct;
  return { comp, part70, conduct, total, grade: xlGrade(total) };
}

// ---------- ยึดโยงชิ้นงาน/ข้อสอบ → สมรรถนะ (ปรับสัดส่วนคะแนนอัตโนมัติ) ----------
// รูปแบบ link ของแต่ละข้อ:  a:<assignment_id>:total  |  a:<assignment_id>:<ลำดับเกณฑ์>  |  e:<exam_index>
function rptLinkMax(s, link) {
  if (!link) return null;
  const p = link.split(':');
  if (p[0] === 'a') {
    const a = s.assignments.find(x => x.assignment_id === p[1]); if (!a) return null;
    return p[2] === 'total' ? a.rubric.reduce((t, x) => t + (Number(x.max) || 0), 0) : (a.rubric[+p[2]] ? Number(a.rubric[+p[2]].max) || 0 : null);
  }
  if (p[0] === 'e') { const ex = s.exams[+p[1]]; return ex ? ex.questions.length : null; }
  return null;
}
// คะแนนดิบของนักเรียนจากที่มาที่ผูกไว้ — ถ้าทำหลายครั้งใช้ครั้งที่ได้สูงสุด; ยังไม่ส่ง/ไม่ได้สอบ = null
function rptRaw(s, st, link) {
  const max = rptLinkMax(s, link);
  if (!max) return null;
  const p = link.split(':');
  if (p[0] === 'a') {
    const idx = s.assignments.findIndex(x => x.assignment_id === p[1]);
    const subs = st.submissions.filter(x => x.subject_id === s.subject_id && x.assignment_index === idx);
    if (!subs.length) return null;
    const vals = subs.map(x => p[2] === 'total' ? Number(x.total) : Number(x.result && x.result.criteria && x.result.criteria[+p[2]] ? x.result.criteria[+p[2]].score : NaN)).filter(v => !isNaN(v));
    if (!vals.length) return null;
    return { raw: Math.min(Math.max.apply(null, vals), max), max };
  }
  const idx = +p[1];
  const att = st.exam_attempts.filter(x => x.subject_id === s.subject_id && x.exam_index === idx);
  if (!att.length) return null;
  return { raw: Math.min(Math.max.apply(null, att.map(x => Number(x.score) || 0)), max), max };
}
function rptRound(v, mode) {
  if (mode === 'int') return Math.round(v);
  if (mode === 'tenth') return Math.round(v * 10) / 10;
  return Math.round(v * 2) / 2;
}
// ---------- แปลงค่าความสามารถ (กราฟหกเหลี่ยม) → คะแนนในรายงาน ----------
//  ปัญญา → คะแนนสอบ (ข้อ "ทฤษฎี") · เฉลี่ย(ทักษะ, สร้างสรรค์) → คะแนนการปฏิบัติ (ข้อ "ปฏิบัติ")
//  เฉลี่ย(ความเร็ว, ตรงต่อเวลา, ความเพียร) → จิตพิสัย 30 คะแนน     (ค่าความสามารถเต็ม 100 = คะแนนเต็ม)
const RPT_ABILITY_CAP = ABILITY_MAX;
function rptKind(it) { return it && it.kind === 'theory' ? 'theory' : 'practice'; }
function rptMode(it) { return it.link ? 'link' : (it.manual ? 'manual' : 'auto'); }
function rptAbVal(st, key) { return Math.max(0, Math.min(Number(st.ability && st.ability[key]) || 0, RPT_ABILITY_CAP)); }
function rptSkillW(r) { const w = Number(r && r.skillW); return (r && r.skillW != null && !isNaN(w)) ? Math.max(0, Math.min(100, w)) : 70; }
const RPT_FOCUS = { skill: 'ทักษะ', creative: 'สร้างสรรค์', mix: 'ผสม' };
function rptFocus(it) { return it && (it.focus === 'creative' || it.focus === 'mix') ? it.focus : 'skill'; }
function rptKindAbility(st, kind, r, focus) {
  if (kind === 'theory') return { v: rptAbVal(st, 'intelligence'), label: 'ปัญญา' };
  if (focus === 'creative') return { v: rptAbVal(st, 'creativity'), label: 'สร้างสรรค์' };
  if (focus === 'mix') {
    const w = rptSkillW(r);
    return { v: rptAbVal(st, 'skill') * w / 100 + rptAbVal(st, 'creativity') * (100 - w) / 100, label: `ทักษะ·สร้างสรรค์ ${w}:${100 - w}` };
  }
  return { v: rptAbVal(st, 'skill'), label: 'ทักษะ' };
}
// ข้อความอธิบายที่มาของคะแนนอัตโนมัติ
function rptAutoText(it, r) {
  if (rptKind(it) === 'theory') return 'ค่า "ปัญญา"';
  const f = rptFocus(it);
  return f === 'creative' ? 'ค่า "สร้างสรรค์" (ครูกำหนด)' : f === 'mix' ? ('ค่า "ทักษะ" ' + rptSkillW(r) + '% + "สร้างสรรค์" ' + (100 - rptSkillW(r)) + '%') : 'ค่า "ทักษะ"';
}
function rptConductAvg(st) { return (rptAbVal(st, 'speed') + rptAbVal(st, 'punctuality') + rptAbVal(st, 'perseverance')) / 3; }
function rptStep(mode) { return mode === 'int' ? 1 : (mode === 'tenth' ? 0.1 : 0.5); }
// กระจายคะแนนจิตพิสัยรวม (เต็ม 30) ลง 10 ข้อ ข้อละไม่เกิน 3 โดยผลรวมเท่าคะแนนรวมพอดี
function rptConductItems(st, r) {
  const step = rptStep(r.round), total = Math.min(30, rptRound(rptConductAvg(st) / RPT_ABILITY_CAP * 30, r.round));
  const units = Math.round(total / step), base = Math.floor(units / 10), rem = units % 10;
  return Array.from({ length: 10 }, (_, i) => Number(((base + (i < rem ? 1 : 0)) * step).toFixed(1)));
}
// คะแนนจริงของข้อหนึ่ง: ผูกชิ้นงาน/ข้อสอบ = ดิบ ÷ เต็มดิบ × คะแนนเต็มของข้อ ; อัตโนมัติ = ค่าความสามารถ ÷ 100 × คะแนนเต็มของข้อ ; กรอกเอง = ค่าที่ครูกรอก
function rptItemVal(s, r, st, ci, k) {
  const it = r.comps[ci].items[k]; if (!it) return null;
  const max = Number(it.max) || 0, mode = rptMode(it);
  if (mode === 'link') {
    const rw = rptRaw(s, st, it.link);
    return rw ? Math.min(rptRound(rw.raw / rw.max * max, r.round), max) : null;
  }
  if (mode === 'auto') return Math.min(rptRound(rptKindAbility(st, rptKind(it), r, rptFocus(it)).v / RPT_ABILITY_CAP * max, r.round), max);
  const sc = r.scores[st.student_id], v = sc && sc.c[ci] ? sc.c[ci][k] : null;
  return (v == null || v === '') ? null : Number(v);
}
function rptBadges(s, kind, key) {
  const r = s.report; if (!r) return ' <span class="badge gray">ยังไม่ผูกรายงาน</span>';
  const hit = [];
  r.comps.forEach((c, ci) => c.items.forEach((it, k) => {
    if (!it.link) return; const p = it.link.split(':');
    if ((kind === 'a' && p[0] === 'a' && p[1] === key) || (kind === 'e' && p[0] === 'e' && +p[1] === key)) hit.push(`สมรรถนะ ${ci + 1} ข้อ ${k + 1}`);
  }));
  return hit.length ? ' ' + hit.map(h => `<span class="badge gold">→ ${h}</span>`).join(' ') : ' <span class="badge gray">ยังไม่ผูกรายงาน</span>';
}

function rptStudentData(s, r) {
  return rosterFor(s.subject_id).map(st => {
    const nm = splitName(st.full_name), sc = r.scores[st.student_id] || {};
    const att = {};
    DEMO.attendance.forEach(a => {
      if (a.subject_id !== s.subject_id) return;
      const rec = a.records.find(x => x.student_id === st.student_id);
      if (rec) att[a.date] = rec.status;
    });
    const c = r.comps.map((comp, ci) => comp.items.map((it, k) => rptItemVal(s, r, st, ci, k)));
    return { id: st.student_id, prefix: st.prefix || '', first: nm.first, last: nm.last, gender: genderOf(st.prefix), c, j: r.conductMode === 'manual' ? (sc.j || []) : rptConductItems(st, r), att };
  });
}
function reportDataForSubject(s) {
  const r = ensureReport(s);
  const dates = Array.from(new Set(DEMO.attendance.filter(a => a.subject_id === s.subject_id).map(a => a.date))).sort();
  return {
    subject: s.subject_name, code: s.subject_code, cohort: r.cohort, hours: r.hours, dept: r.dept, term: r.term, year: r.year, school: r.school || '',
    start: r.start, end: r.end, rounds: r.rounds, teacher: teacherFullName(),
    deptHead: r.signers.deptHead, measure: r.signers.measure, academic: r.signers.academic, director: r.signers.director,
    comps: r.comps, students: rptStudentData(s, r), dates,
  };
}

  const r = ensureReport(s);
  const short = !!rptForm(s);
  byId('subject-tab-body').innerHTML = `
    <div class="card">
      <h2>รายงานผลคะแนน — นำออกเป็นไฟล์ Excel</h2>
      <p class="meta" style="line-height:1.7;">คะแนนสมรรถนะ จิตพิสัย และเวลาเรียนที่บันทึกในแอป จะถูกเติมลงฟอร์มต้นฉบับของวิทยาลัยโดยตรง (ปก · ใบบันทึกผลการเรียน · สรุปผล · บันทึกเวลาเรียน)</p>
      ${short ? '' : `<div class="error-msg" style="display:block;margin-top:8px;">วิชานี้เป็นระดับ ${escapeHtml(s.level)} — ฟอร์มที่พร้อมนำออกตอนนี้คือ "ระยะสั้น" และ "แกนมัธยม" ยังรอไฟล์แบบฟอร์มของระดับนี้ จึงยังกดนำออกไม่ได้ (กรอกคะแนนเก็บไว้ได้ตามปกติ)</div>`}
    </div>
    <div class="card" id="rpt_info">${rptInfoHtml(s, r)}</div>

    <div class="card" id="rpt_creative">${rptCreativityHtml()}</div>
    <div class="card"><h2>กรอกคะแนน</h2><div id="rpt_scores">${rptScoresHtml(s, r)}</div></div>
    <div class="card"><h2>สรุปผลการเรียน</h2><div id="rpt_summary">${rptSummaryHtml(s, r)}</div></div>
    <div class="card" id="rpt_export">${rptExportHtml(s, r)}</div>`;
}
